      --veil-glint: rgba(209, 250, 229, 0.12);
    }

    /* ==================== 基础排版与无障碍焦点 ==================== */
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent) !important;
      outline-offset: 3px;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: Inter, "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
      transition: background-color 0.28s ease, color 0.28s ease;
    }

    ::selection {
      background-color: var(--badge-bg);
      color: var(--accent);
    }

    .tracking-editorial { letter-spacing: -0.012em; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 中英文正文微调：中文舒展，英文紧致利落 */
    #readerBody {
      font-size: 16px;
      line-height: 1.92;
      letter-spacing: 0.01em;
    }
    html[lang="en"] body {
      letter-spacing: -0.005em;
    }
    html[lang="en"] #readerBody {
      font-size: 15.5px;
      line-height: 1.78;
      letter-spacing: 0;
    }
    html[lang="en"] #readerTitle {
      overflow-wrap: anywhere;
    }

    /* ==================== View Transition：主题圆形扩散 & 卷轴青雾光帘过渡 ==================== */
    ::view-transition {
      background-color: var(--bg);
    }
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) { z-index: 1; }
    ::view-transition-new(root) { z-index: 9999; }

    /* 语言切换：东方卷轴式「青雾光帘斜拂」过渡（中→英自左向右翻页，英→中自右向左展卷） */
    #langSweepVeil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      will-change: transform, opacity;
    }

    html.language-sweep #langSweepVeil {
      view-transition-name: lang-veil;
      visibility: visible;
    }

    html.language-sweep.lang-ltr #langSweepVeil {
      background: linear-gradient(
        98deg,
        transparent 24%,
        var(--veil-edge) 41%,
        var(--veil-core) 48.5%,
        var(--veil-glint) 50.5%,
        var(--veil-edge) 58%,
        transparent 76%
      );
    }

    html.language-sweep.lang-rtl #langSweepVeil {
      background: linear-gradient(
        262deg,
        transparent 24%,
        var(--veil-edge) 41%,
        var(--veil-core) 48.5%,
        var(--veil-glint) 50.5%,
        var(--veil-edge) 58%,
        transparent 76%
      );
    }

    #langSweepVeil.is-visible {
      opacity: 1;
    }

    @keyframes langCurtainOldLTR {
      0% {
        -webkit-mask-position: 100% 0;
        mask-position: 100% 0;
        filter: blur(0px);
        transform: translateX(0);
        opacity: 1;
      }
      100% {
        -webkit-mask-position: 0% 0;
        mask-position: 0% 0;
        filter: blur(3.5px);
        transform: translateX(-12px);
        opacity: 0.72;
      }
    }

    @keyframes langCurtainNewLTR {
      0% {
        -webkit-mask-position: 100% 0;
        mask-position: 100% 0;
        filter: blur(2.5px);
        transform: translateX(14px);
      }
      72% {
        filter: blur(0.4px);
      }
      100% {
        -webkit-mask-position: 0% 0;
        mask-position: 0% 0;
        filter: blur(0px);
        transform: translateX(0);
      }
    }

    @keyframes langCurtainOldRTL {
      0% {
        -webkit-mask-position: 0% 0;
        mask-position: 0% 0;
        filter: blur(0px);
        transform: translateX(0);
        opacity: 1;
      }
      100% {
        -webkit-mask-position: 100% 0;
        mask-position: 100% 0;
        filter: blur(3.5px);
        transform: translateX(12px);
        opacity: 0.72;
      }
    }

    @keyframes langCurtainNewRTL {
      0% {
        -webkit-mask-position: 0% 0;
        mask-position: 0% 0;
        filter: blur(2.5px);
        transform: translateX(-14px);
      }
      72% {
        filter: blur(0.4px);
      }
      100% {
        -webkit-mask-position: 100% 0;
        mask-position: 100% 0;
        filter: blur(0px);
        transform: translateX(0);
      }
    }

    @keyframes langVeilGlideLTR {
      0% { transform: translateX(-100vw); opacity: 0; }
      18% { opacity: 1; }
      82% { opacity: 0.92; }
      100% { transform: translateX(100vw); opacity: 0; }
    }

    @keyframes langVeilGlideRTL {
      0% { transform: translateX(100vw); opacity: 0; }
      18% { opacity: 1; }
      82% { opacity: 0.92; }
      100% { transform: translateX(-100vw); opacity: 0; }
    }

    @keyframes langFallbackReveal {
      from { opacity: 0; filter: blur(3px); transform: translateY(5px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }

    html.language-sweep::view-transition-group(root) {
      animation-duration: 780ms;
    }

    html.language-sweep.lang-ltr::view-transition-old(root) {
      z-index: 1;
      -webkit-mask-image: linear-gradient(98deg, transparent 0%, transparent 41%, #000 61%, #000 100%);
      mask-image: linear-gradient(98deg, transparent 0%, transparent 41%, #000 61%, #000 100%);
      -webkit-mask-size: 300% 100%;
      mask-size: 300% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      animation: langCurtainOldLTR 780ms cubic-bezier(0.32, 0.72, 0.22, 1) both;
    }

    html.language-sweep.lang-ltr::view-transition-new(root) {
      z-index: 2;
      -webkit-mask-image: linear-gradient(98deg, #000 0%, #000 39%, transparent 59%, transparent 100%);
      mask-image: linear-gradient(98deg, #000 0%, #000 39%, transparent 59%, transparent 100%);
      -webkit-mask-size: 300% 100%;
      mask-size: 300% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      animation: langCurtainNewLTR 780ms cubic-bezier(0.32, 0.72, 0.22, 1) both;
    }

    html.language-sweep.lang-rtl::view-transition-old(root) {
      z-index: 1;
      -webkit-mask-image: linear-gradient(262deg, transparent 0%, transparent 41%, #000 61%, #000 100%);
      mask-image: linear-gradient(262deg, transparent 0%, transparent 41%, #000 61%, #000 100%);
      -webkit-mask-size: 300% 100%;
      mask-size: 300% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      animation: langCurtainOldRTL 780ms cubic-bezier(0.32, 0.72, 0.22, 1) both;
    }

    html.language-sweep.lang-rtl::view-transition-new(root) {
      z-index: 2;
      -webkit-mask-image: linear-gradient(262deg, #000 0%, #000 39%, transparent 59%, transparent 100%);
      mask-image: linear-gradient(262deg, #000 0%, #000 39%, transparent 59%, transparent 100%);
      -webkit-mask-size: 300% 100%;
      mask-size: 300% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      animation: langCurtainNewRTL 780ms cubic-bezier(0.32, 0.72, 0.22, 1) both;
    }

    html.language-sweep::view-transition-group(lang-veil) {
      z-index: 4;
      animation-duration: 780ms;
    }
    html.language-sweep::view-transition-old(lang-veil) {
      animation: none;
      opacity: 0;
    }
    html.language-sweep.lang-ltr::view-transition-new(lang-veil) {
      animation: langVeilGlideLTR 780ms cubic-bezier(0.32, 0.72, 0.22, 1) both;
    }
    html.language-sweep.lang-rtl::view-transition-new(lang-veil) {
      animation: langVeilGlideRTL 780ms cubic-bezier(0.32, 0.72, 0.22, 1) both;
    }

    /* 顶部控制栏在光帘拂过时保持清晰悬停在最上层 */
    html.language-sweep #topControlBar {
      view-transition-name: top-bar;
    }
    html.language-sweep::view-transition-group(top-bar) {
      z-index: 6;
      animation-duration: 320ms;
    }

    /* 不支持 View Transition 时的优雅降级 */
    .lang-fallback-in {
      animation: langFallbackReveal 480ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ==================== 顶部居中黑白药丸滑块开关 & 内容区右上角对齐栏 ==================== */
    #topControlBar {
      position: fixed;
      top: 14px;
      left: 0;
      right: 0;
      z-index: 40;
      pointer-events: none;
    }

    .top-control-inner {
      position: relative;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #themeDock {
      pointer-events: auto;
    }

    .theme-switch-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 9999px;
      background-color: var(--switch-track-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid transparent;
    }

    .theme-switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 30px;
      height: 30px;
      border-radius: 9999px;
      background-color: var(--switch-knob-bg);
      box-shadow: var(--switch-knob-shadow);
      transition: transform 0.36s cubic-bezier(0.22, 1.15, 0.36, 1), background-color 0.25s ease;
      pointer-events: none;
    }

    [data-theme="dark"] .theme-switch-knob { transform: translateX(32px); }

    .theme-switch-btn {
      position: relative;
      z-index: 1;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      color: var(--meta);
      transition: color 0.22s ease;
      cursor: pointer;
    }
    .theme-switch-btn:hover { color: var(--ink); }
    html:not([data-theme="dark"]) #lightThemeBtn { color: var(--ink); }
    [data-theme="dark"] #darkThemeBtn { color: var(--ink); }

    /* ==================== 顶部 5 张扇形插画卡片（与 580px 主栏严格对齐） ==================== */
    #fanHeader { padding-top: 104px; padding-bottom: 18px; }
    .fan-stage {
      position: relative;
      width: 100%;
      max-width: 580px;
      container-type: inline-size;
      aspect-ratio: 580 / 184;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fan-card {
      position: absolute;
      width: 40%;
      aspect-ratio: 1.56;
      box-sizing: border-box;
      padding: 0;
      border-radius: 5px;
      border: 4px solid #fff;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 15px 26px -10px rgba(0, 0, 0, .24), 0 3px 8px rgba(0, 0, 0, .09);
      cursor: pointer;
      transform-origin: center center;
      transition: transform .42s cubic-bezier(.22, 1.12, .36, 1), box-shadow .32s ease;
      will-change: transform;
    }
    .fan-card svg { width: 100%; height: 100%; display: block; }
    [data-theme="dark"] .fan-card { border-color: #e5e5e5; box-shadow: 0 14px 28px -7px #000a; }
    .fan-card[data-pos="0"] { transform: translate(-30cqw, 1.5cqw) rotate(-9deg); z-index: 1; }
    .fan-card[data-pos="1"] { transform: translate(-15cqw, .5cqw) rotate(-4.5deg); z-index: 2; }
    .fan-card[data-pos="2"] { transform: translate(0, 0); z-index: 5; }
    .fan-card[data-pos="3"] { transform: translate(15cqw, .5cqw) rotate(4.5deg); z-index: 2; }
    .fan-card[data-pos="4"] { transform: translate(30cqw, 1.5cqw) rotate(9deg); z-index: 1; }

    @media (hover: hover) and (pointer: fine) {
      .fan-stage[data-hover-idx="0"] .fan-card[data-pos="0"] { transform: translate(-30cqw, -2.4cqw) rotate(0deg) scale(1.08); z-index: 20; box-shadow: var(--fan-hover-shadow); }
      .fan-stage[data-hover-idx="0"] .fan-card[data-pos="1"] { transform: translate(-12.2cqw, 0.9cqw) rotate(-4.5deg) scale(0.98); }
      .fan-stage[data-hover-idx="0"] .fan-card[data-pos="2"] { transform: translate(0.8cqw, 0.0cqw) rotate(0.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="0"] .fan-card[data-pos="3"] { transform: translate(15.8cqw, 0.9cqw) rotate(4.5deg) scale(0.98); }
      .fan-stage[data-hover-idx="0"] .fan-card[data-pos="4"] { transform: translate(30.8cqw, 1.8cqw) rotate(9.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="1"] .fan-card[data-pos="0"] { transform: translate(-32.8cqw, 1.8cqw) rotate(-9.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="1"] .fan-card[data-pos="1"] { transform: translate(-15cqw, -2.4cqw) rotate(0deg) scale(1.08); z-index: 20; box-shadow: var(--fan-hover-shadow); }
      .fan-stage[data-hover-idx="1"] .fan-card[data-pos="2"] { transform: translate(2.8cqw, 0.0cqw) rotate(0.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="1"] .fan-card[data-pos="3"] { transform: translate(15.8cqw, 0.9cqw) rotate(4.5deg) scale(0.98); }
      .fan-stage[data-hover-idx="1"] .fan-card[data-pos="4"] { transform: translate(30.8cqw, 1.8cqw) rotate(9.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="2"] .fan-card[data-pos="0"] { transform: translate(-30.8cqw, 1.8cqw) rotate(-9.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="2"] .fan-card[data-pos="1"] { transform: translate(-17.8cqw, 0.9cqw) rotate(-4.5deg) scale(0.98); }
      .fan-stage[data-hover-idx="2"] .fan-card[data-pos="2"] { transform: translate(0cqw, -2.4cqw) rotate(0deg) scale(1.08); z-index: 20; box-shadow: var(--fan-hover-shadow); }
      .fan-stage[data-hover-idx="2"] .fan-card[data-pos="3"] { transform: translate(17.8cqw, 0.9cqw) rotate(4.5deg) scale(0.98); }
      .fan-stage[data-hover-idx="2"] .fan-card[data-pos="4"] { transform: translate(30.8cqw, 1.8cqw) rotate(9.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="3"] .fan-card[data-pos="0"] { transform: translate(-30.8cqw, 1.8cqw) rotate(-9.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="3"] .fan-card[data-pos="1"] { transform: translate(-15.8cqw, 0.9cqw) rotate(-4.5deg) scale(0.98); }
      .fan-stage[data-hover-idx="3"] .fan-card[data-pos="2"] { transform: translate(-2.8cqw, 0.0cqw) rotate(0.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="3"] .fan-card[data-pos="3"] { transform: translate(15cqw, -2.4cqw) rotate(0deg) scale(1.08); z-index: 20; box-shadow: var(--fan-hover-shadow); }
      .fan-stage[data-hover-idx="3"] .fan-card[data-pos="4"] { transform: translate(32.8cqw, 1.8cqw) rotate(9.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="4"] .fan-card[data-pos="0"] { transform: translate(-30.8cqw, 1.8cqw) rotate(-9.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="4"] .fan-card[data-pos="1"] { transform: translate(-15.8cqw, 0.9cqw) rotate(-4.5deg) scale(0.98); }
      .fan-stage[data-hover-idx="4"] .fan-card[data-pos="2"] { transform: translate(-0.8cqw, 0.0cqw) rotate(0.0deg) scale(0.98); }
      .fan-stage[data-hover-idx="4"] .fan-card[data-pos="3"] { transform: translate(12.2cqw, 0.9cqw) rotate(4.5deg) scale(0.98); }
      .fan-stage[data-hover-idx="4"] .fan-card[data-pos="4"] { transform: translate(30cqw, -2.4cqw) rotate(0deg) scale(1.08); z-index: 20; box-shadow: var(--fan-hover-shadow); }
    }

    @media (max-width: 640px) {
      #fanHeader { padding-top: 88px; padding-bottom: 14px; }
      .fan-stage { width: calc(100% - 14px); }
      .fan-card { border-width: 3px; border-radius: 4px; }
    }

    /* ==================== 桌面左侧主题导航 & 右上角安静语言切换 ==================== */
    #desktopLeftNav {
      right: calc(50% + clamp(318px, 34vw, 374px));
      top: 50%;
      transform: translateY(-50%);
      width: 78px;
      z-index: 15;
    }

    #desktopLeftNav.in-reader {
      opacity: 0;
      pointer-events: none;
    }

    #desktopTopicDot {
      position: absolute;
      top: 0;
      left: 0;
      width: 4.5px;
      height: 4.5px;
      border-radius: 9999px;
      background-color: var(--accent);
      pointer-events: none;
      opacity: 0;
      transition: transform 0.42s cubic-bezier(0.22, 1.18, 0.36, 1), opacity 0.2s ease, background-color 0.25s ease;
      will-change: transform;
    }

    /* 紧贴 580px 主内容栏右上角，与居中黑白切换胶囊水平齐平 */
    .language-switch {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: auto;
      height: 26px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--meta);
      user-select: none;
    }

    .language-switch button {
      position: relative;
      padding: 2px 1px;
      border: 0;
      background: transparent;
      color: var(--meta);
      font: inherit;
      cursor: pointer;
      transition: color 0.24s ease;
    }
    .language-switch button:hover,
    .language-switch button[aria-pressed="true"] {
      color: var(--ink);
    }
    .language-switch button[aria-pressed="true"] {
      font-weight: 500;
    }
    .language-switch button:focus-visible {
      outline: 1.5px solid var(--accent) !important;
      outline-offset: 4px;
      border-radius: 2px;
    }
    .language-separator {
      color: var(--meta);
      opacity: 0.42;
      font-weight: 400;
      user-select: none;
    }

    /* 极细松墨绿滑动下划线 */
    .lang-active-bar {
      position: absolute;
      bottom: 1px;
      left: 0;
      height: 1.5px;
      border-radius: 9999px;
      background-color: var(--accent);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.42s cubic-bezier(0.22, 1.15, 0.36, 1), width 0.42s cubic-bezier(0.22, 1.15, 0.36, 1), opacity 0.2s ease;
      will-change: transform, width;
    }

    /* ==================== 联系我按钮 ==================== */
    .submit-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 23px;
      padding: 0 8.5px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink);
      background-color: var(--surface);
      border: 1px solid transparent;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.14s ease;
    }
    .submit-pill-btn:hover { background-color: var(--surface-hover); color: var(--ink); }
    .submit-pill-btn:active { transform: scale(0.96); }
    .submit-pill-btn.is-open { background-color: var(--ink); color: var(--bg); }

    /* ==================== 搜索框聚焦态 ==================== */
    .search-box-shell {
      background-color: var(--surface);
      border: 1px solid transparent;
      transition: background-color 0.2s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }
    .search-box-shell:hover { background-color: var(--surface-hover); }
    .search-box-shell:focus-within {
      background-color: var(--bg);
      border-color: var(--search-focus-border);
      box-shadow: 0 0 0 3px var(--search-focus-ring);
    }
    .search-box-shell .search-icon { color: var(--meta); transition: color 0.2s ease; }
    .search-box-shell:focus-within .search-icon { color: var(--ink); }
    .search-kbd {
      background-color: var(--kbd-bg);
      color: var(--meta);
      box-shadow: var(--kbd-shadow);
    }

    /* ==================== 分段白色滑块栏 & 视图切换 ==================== */
    .segmented-track {
      position: relative;
      background-color: var(--surface);
      border-radius: 10px;
      padding: 3px;
    }

    .segmented-pill {
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 0;
      border-radius: 7.5px;
      background-color: var(--pill-bg);
      box-shadow: var(--pill-shadow);
      pointer-events: none;
      opacity: 0;
      transition: transform 0.36s cubic-bezier(0.22, 1.12, 0.36, 1), width 0.36s cubic-bezier(0.22, 1.12, 0.36, 1), opacity 0.2s ease, background-color 0.25s ease;
      will-change: transform, width;
    }

    .view-toggle-track {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 3px;
      height: 38px;
      border-radius: 10px;
      background-color: var(--surface);
      flex-shrink: 0;
    }

    .view-toggle-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 32px;
      height: 32px;
      border-radius: 7.5px;
      background-color: var(--pill-bg);
      box-shadow: var(--pill-shadow);
      pointer-events: none;
      transition: transform 0.34s cubic-bezier(0.22, 1.15, 0.36, 1), background-color 0.25s ease;
    }
    .view-toggle-track[data-mode="grid"] .view-toggle-knob { transform: translateX(34px); }

    /* ==================== 列表项响应排版：大屏单行渐隐，小屏优雅双行 ==================== */
    .entry-row {
      width: 100%;
      padding: 9.5px 10px;
      margin-inline: -10px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.16s ease;
    }
    .entry-row:hover { background-color: var(--row-hover); }

    .entry-row-main {
      min-width: 0;
      flex: 1;
      font-size: 14.5px;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to right, #000 84%, transparent 100%);
      mask-image: linear-gradient(to right, #000 84%, transparent 100%);
    }
    .entry-row-summary-inline {
      color: var(--summary);
      font-size: 13.5px;
      font-weight: 400;
      margin-left: 10px;
    }
    .entry-row-mobile-summary {
      display: none;
      margin-top: 2px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--summary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .entry-row-mobile-date { display: none; }

    @media (max-width: 539px) {
      .entry-row {
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 10px 8px;
        margin-inline: -8px;
      }
      .entry-row-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        -webkit-mask-image: none;
        mask-image: none;
      }
      .entry-row-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .entry-row-summary-inline,
      .entry-row-desktop-meta {
        display: none;
      }
      .entry-row-mobile-date {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .entry-row-mobile-summary {
        display: block;
      }
    }

    /* ==================== 列表切换柔和模糊动效 ==================== */
    @keyframes listReveal {
      from { opacity: 0; transform: translateY(5px); filter: blur(2px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .list-animate { animation: listReveal 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* ==================== 网格卡片微动效 ==================== */
    .grid-card-thumb {
      border: 1px solid var(--border-subtle);
      transition: transform 0.32s cubic-bezier(0.22, 1.08, 0.36, 1), box-shadow 0.28s ease, border-color 0.25s ease;
    }
    .grid-card:hover .grid-card-thumb {
      transform: translateY(-2.5px);
      border-color: rgba(128, 128, 138, 0.24);
      box-shadow: 0 14px 28px -10px rgba(0, 0, 0, 0.13);
    }

    /* ==================== 联系我浮出卡片（小屏支持垂直滚动防裁切） ==================== */
    #contactPopover {
      position: fixed;
      z-index: 50;
      width: 332px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      border-radius: 16px;
      background-color: var(--modal-bg);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 22px 50px -12px rgba(0, 0, 0, 0.18), 0 4px 14px rgba(0, 0, 0, 0.06);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px) scale(0.97);
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.22, 1.1, 0.36, 1);
    }
    #contactPopover.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    /* ==================== 底部悬浮「随机看看」按钮 ==================== */
    .surprise-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 62px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 14px;
      background: var(--surprise-grad);
      pointer-events: none;
      z-index: 30;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .surprise-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 35px;
      padding: 0 15px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      background-color: var(--surprise-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--surprise-shadow);
      transition: transform 0.2s cubic-bezier(0.22, 1.15, 0.36, 1), border-color 0.2s ease, color 0.2s ease;
      cursor: pointer;
    }
    .surprise-btn:hover { transform: translateY(-1.5px); color: var(--accent); }
    .surprise-btn:active { transform: translateY(0) scale(0.97); }

    /* ==================== 阅读进度条 & Toast ==================== */
    #readingProgressBar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background-color: var(--accent);
      z-index: 60;
      opacity: 0;
      transition: opacity 0.2s ease, width 0.08s linear;
      pointer-events: none;
    }

    #toastNotice {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translate(-50%, 10px);
      background-color: var(--ink);
      color: var(--bg);
      font-size: 12.5px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 9999px;
      opacity: 0;
      pointer-events: none;
      z-index: 70;
      transition: opacity 0.22s ease, transform 0.22s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      white-space: nowrap;
    }
    #toastNotice.show { opacity: 1; transform: translate(-50%, 0); }

    /* 保证少量结果也能滚动至筛选区，非吸顶定位 */
    #directoryFilters:focus-within { position: relative; z-index: 31; }
    #directoryView.topic-jumped {
      min-height: max(0px, calc(var(--filter-offset, 0px) + 100vh - var(--directory-jump-inset) - 128px));
      overflow-anchor: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    const state = {
      topic: '全部',
      format: 'all',
      query: '',
      viewMode: 'list',
      activeEntryId: null,
      directoryScroll: 0,
      popoverOpen: false
    };

    let languageBusy = false;

    function escapeAttr(str) {
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    // ==================== 辅助：生成封面（精选复用手绘插画；其余按双语字体精排） ====================
    function buildThumbSvg(item, scope) {
      const fanIndex = FAN_IDS.indexOf(item.id);
      if (fanIndex !== -1 && FAN_COVERS[fanIndex]) {
        return FAN_COVERS[fanIndex].replace(/id="([^"]+)"/g, `id="$1-${scope}"`).replace(/url\(#([^)]+)\)/g, `url(#$1-${scope})`);
      }

      const uid = `${item.id}-${scope}-${language}`;
      const isVideo = item.format === 'video';
      const isEn = language === 'en';
      const shortTitle = item.coverTitle || item.title.replace(/[《》“”？：]/g, '').slice(0, 8);
      const topic = tr(item.topic || '笔记').toUpperCase();
      const dateStr = formatDisplayDate(item.date, false);
      const titleFont = isEn ? "Inter, -apple-system, sans-serif" : "'Noto Serif SC', serif";
      const titleSize = isEn ? (shortTitle.length > 14 ? '13.5' : '15') : '15';

      return `
        <svg viewBox="0 0 240 150" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <rect width="240" height="150" fill="#F6F5F0" />
          <rect x="14" y="14" width="212" height="122" rx="4" fill="none" stroke="#1F6A4A" stroke-opacity="0.14" stroke-width="0.8" />
          <text x="26" y="34" fill="#1F6A4A" font-size="7.2" font-family="Inter, sans-serif" font-weight="500" letter-spacing="0.6">${topic} · ${dateStr}</text>
          <text x="26" y="74" fill="#18181B" font-size="${titleSize}" font-family="${titleFont}" font-weight="600">${shortTitle}</text>
          <line x1="26" y1="88" x2="112" y2="88" stroke="#18181B" stroke-opacity="0.12" stroke-width="0.8" />
          <circle cx="188" cy="96" r="28" fill="#1F6A4A" fill-opacity="0.07" />
          <path d="M174 116 Q188 86 208 72" fill="none" stroke="#1F6A4A" fill-opacity="0.45" stroke-width="1.2" />
          <ellipse cx="195" cy="86" rx="9" ry="4" transform="rotate(-35 195 86)" fill="#1F6A4A" fill-opacity="0.22" />
          <ellipse cx="183" cy="100" rx="8" ry="3.5" transform="rotate(28 183 100)" fill="#1F6A4A" fill-opacity="0.16" />
          ${isVideo ? `<rect x="26" y="106" width="42" height="15" rx="7.5" fill="#18181B" /><polygon points="35,110.5 41,113.5 35,116.5" fill="#FFFFFF" /><text x="45" y="116.5" fill="#FFFFFF" font-size="6.8" font-family="Inter, sans-serif">${tr('影片')}</text>` : `<rect x="26" y="110" width="16" height="16" rx="3" fill="#1F6A4A" fill-opacity="0.12" /><text x="34" y="121" text-anchor="middle" fill="#1F6A4A" font-size="8.2" font-family="${titleFont}">${tr('气')}</text>`}
        </svg>
      `;
    }

    // ==================== 黑白主题切换 + 圆形波纹扩散 ====================
    function applyThemeAttr(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      try {
        localStorage.setItem('qqiang_theme', theme);
      } catch (e) {}
    }

    function setTheme(targetTheme, event) {
      const isDarkNow = document.documentElement.getAttribute('data-theme') === 'dark';
      const currentTheme = isDarkNow ? 'dark' : 'light';
      if (targetTheme === currentTheme || languageBusy) return;

      let x = window.innerWidth / 2;
      let y = 32;
      if (event && event.currentTarget) {
        const rect = event.currentTarget.getBoundingClientRect();
        x = rect.left + rect.width / 2;
        y = rect.top + rect.height / 2;
      }

      const endRadius = Math.hypot(
        Math.max(x, window.innerWidth - x),
        Math.max(y, window.innerHeight - y)
      );

      if (document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const transition = document.startViewTransition(() => {
          applyThemeAttr(targetTheme);
        });
        transition.ready.then(() => {
          document.documentElement.animate(
            {
              clipPath: [
                `circle(0px at ${x}px ${y}px)`,
                `circle(${endRadius}px at ${x}px ${y}px)`
              ]
            },
            {
              duration: 540,
              easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
              pseudoElement: '::view-transition-new(root)'
            }
          );
        }).catch(() => {});
      } else {
        applyThemeAttr(targetTheme);
      }
    }

    function toggleThemeQuick() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const btn = document.getElementById(isDark ? 'lightThemeBtn' : 'darkThemeBtn');
      setTheme(isDark ? 'light' : 'dark', btn ? { currentTarget: btn } : null);
    }

    // ==================== 渲染顶部 5 张扇形插画卡片 ====================
    function renderFanCards() {
      const stage = document.getElementById('fanStage');
      const caption = document.getElementById('fanCaption');
      if (!stage) return;

      const items = FAN_IDS.map(id => ENTRIES.find(e => e.id === id)).filter(Boolean);
      stage.innerHTML = items.map((item, idx) => `
        <button
          type="button"
          class="fan-card focus:outline-none"
          data-pos="${idx}"
          aria-label="${escapeAttr(item.title)}"
          onclick="openReader('${item.id}')"
          onmouseenter="handleFanHover(${idx})"
          onmouseleave="handleFanLeave()"
          onfocus="handleFanHover(${idx})"
          onblur="handleFanLeave()"
        >
          ${FAN_COVERS[idx] || buildThumbSvg(item, 'fan')}
        </button>
      `).join('');

      if (caption) {
        caption.textContent = '';
        caption.style.opacity = '0';
      }
    }

    function handleFanHover(idx) {
      const title = ENTRIES.find(e => e.id === FAN_IDS[idx])?.title || '';
      const stage = document.getElementById('fanStage');
      const caption = document.getElementById('fanCaption');
      if (stage) stage.setAttribute('data-hover-idx', String(idx));
      if (caption) {
        caption.textContent = title;
        caption.style.opacity = '1';
      }
    }

    function handleFanLeave() {
      const stage = document.getElementById('fanStage');
      const caption = document.getElementById('fanCaption');
      if (stage) stage.removeAttribute('data-hover-idx');
      if (caption) caption.style.opacity = '0';
    }

    // ==================== 左侧悬浮菜单 & 小屏 6 栏主题滑块 ====================
    function renderTopicNavs(instantSync = false) {
      const desktopList = document.getElementById('desktopTopicList');
      const mobileTabs = document.getElementById('mobileTopicTabs');

      if (desktopList) {
        const dotEl = document.getElementById('desktopTopicDot');
        desktopList.innerHTML = '';
        if (dotEl) desktopList.appendChild(dotEl);

        TOPICS.forEach(topic => {
          const isActive = state.topic === topic;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.topic = topic;
          btn.onclick = () => selectTopic(topic);
          btn.className = `relative text-[13px] leading-[1.45] whitespace-nowrap transition-colors cursor-pointer focus:outline-none ${
            isActive ? 'font-medium text-ink' : 'text-meta hover:text-ink'
          }`;
          btn.innerHTML = `<span class="topic-label">${topicNavLabel(topic)}</span>`;
          desktopList.appendChild(btn);
        });
      }

      if (mobileTabs) {
        mobileTabs.innerHTML = TOPICS.map(topic => {
          const isActive = state.topic === topic;
          return `
            <button
              type="button"
              role="tab"
              aria-selected="${isActive}"
              data-mobile-topic="${topic}"
              onclick="selectTopic('${topic}')"
              class="flex-1 min-w-[44px] h-[30px] px-2 text-[12.5px] whitespace-nowrap rounded-[7.5px] transition-colors cursor-pointer focus:outline-none ${
                isActive ? 'font-medium text-ink' : 'text-meta hover:text-ink'
              }"
            >${topicNavLabel(topic)}</button>
          `;
        }).join('');
      }

      if (instantSync) {
        updateDesktopTopicDot(true);
        updateMobileTopicPill(true);
      } else {
        requestAnimationFrame(() => {
          updateDesktopTopicDot(false);
          updateMobileTopicPill(false);
        });
      }
    }

    function updateDesktopTopicDot(instant) {
      const dot = document.getElementById('desktopTopicDot');
      const nav = document.getElementById('desktopTopicList');
      if (!dot || !nav) return;
      const activeBtn = nav.querySelector(`button[data-topic="${state.topic}"]`);
      if (!activeBtn || activeBtn.offsetHeight === 0) return;

      const label = activeBtn.querySelector('.topic-label');
      const labelW = label ? label.offsetWidth : activeBtn.offsetWidth;
      const x = activeBtn.offsetLeft + labelW + 8;
      const y = activeBtn.offsetTop + activeBtn.offsetHeight / 2 - 2.25;

      if (instant) {
        const prev = dot.style.transition;
        dot.style.transition = 'none';
        dot.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        dot.style.opacity = '1';
        void dot.offsetWidth;
        dot.style.transition = prev;
      } else {
        dot.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        dot.style.opacity = '1';
      }
    }

    function updateMobileTopicPill(instant) {
      const pill = document.getElementById('mobileTopicSliderPill');
      const track = document.getElementById('mobileTopicTrack');
      if (!pill || !track) return;
      const activeBtn = track.querySelector(`button[data-mobile-topic="${state.topic}"]`);
      if (!activeBtn || activeBtn.offsetWidth === 0) return;

      const x = activeBtn.offsetLeft + 3;
      const w = activeBtn.offsetWidth;

      if (instant) {
        const prev = pill.style.transition;
        pill.style.transition = 'none';
        pill.style.width = `${w}px`;
        pill.style.transform = `translate3d(${x}px, 0, 0)`;
        pill.style.opacity = '1';
        void pill.offsetWidth;
        pill.style.transition = prev;
      } else {
        pill.style.width = `${w}px`;
        pill.style.transform = `translate3d(${x}px, 0, 0)`;
        pill.style.opacity = '1';
      }
    }

    function alignDirectoryFilters() {
      const directory = document.getElementById('directoryView');
      const filters = document.getElementById('directoryFilters');
      if (!directory || !filters || state.activeEntryId) return;
      const offset = filters.getBoundingClientRect().top - directory.getBoundingClientRect().top;
      directory.style.setProperty('--filter-offset', `${offset}px`);
      directory.classList.add('topic-jumped');
      filters.scrollIntoView({
        block: 'start',
        behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth'
      });
    }

    function selectTopic(topic) {
      if (state.activeEntryId) closeReader();
      if (state.topic !== topic) {
        state.topic = topic;
        renderTopicNavs(false);
        renderDirectory(true);
      }
      requestAnimationFrame(alignDirectoryFilters);
    }

    // ==================== 分段形式标签栏 ====================
    function renderFormatTabs(instantSync = false) {
      const container = document.getElementById('formatTabs');
      if (!container) return;

      container.innerHTML = FORMATS.map(f => {
        const isActive = state.format === f.id;
        return `
          <button
            type="button"
            role="tab"
            aria-selected="${isActive}"
            data-format="${f.id}"
            onclick="selectFormat('${f.id}')"
            class="h-[30px] text-[12.5px] rounded-[7.5px] transition-colors cursor-pointer focus:outline-none ${
              isActive ? 'font-medium text-ink' : 'text-meta hover:text-ink'
            }"
          >${tr(f.label)}</button>
        `;
      }).join('');

      if (instantSync) {
        updateFormatPill(true);
      } else {
        requestAnimationFrame(() => updateFormatPill(false));
      }
    }

    function updateFormatPill(instant) {
      const pill = document.getElementById('formatSliderPill');
      const tabs = document.getElementById('formatTabs');
      if (!pill || !tabs) return;
      const activeBtn = tabs.querySelector(`button[data-format="${state.format}"]`);
      if (!activeBtn || activeBtn.offsetWidth === 0) return;

      const x = activeBtn.offsetLeft + 3;
      const w = activeBtn.offsetWidth;

      if (instant) {
        const prev = pill.style.transition;
        pill.style.transition = 'none';
        pill.style.width = `${w}px`;
        pill.style.transform = `translate3d(${x}px, 0, 0)`;
        pill.style.opacity = '1';
        void pill.offsetWidth;
        pill.style.transition = prev;
      } else {
        pill.style.width = `${w}px`;
        pill.style.transform = `translate3d(${x}px, 0, 0)`;
        pill.style.opacity = '1';
      }
    }

    function selectFormat(fmt) {
      if (state.format === fmt) return;
      state.format = fmt;
      renderFormatTabs(false);
      renderDirectory(true);
    }

    // ==================== 列表 / 网格视图切换 ====================
    function setViewMode(mode) {
      if (state.viewMode === mode) return;
      state.viewMode = mode;

      const track = document.getElementById('viewToggleTrack');
      const listBtn = document.getElementById('viewListBtn');
      const gridBtn = document.getElementById('viewGridBtn');

      if (track) track.setAttribute('data-mode', mode);
      if (listBtn) {
        listBtn.setAttribute('aria-pressed', String(mode === 'list'));
        listBtn.className = `relative z-10 w-[32px] h-[32px] inline-flex items-center justify-center rounded-[7.5px] transition-colors cursor-pointer focus:outline-none ${
          mode === 'list' ? 'text-ink' : 'text-meta hover:text-ink'
        }`;
      }
      if (gridBtn) {
        gridBtn.setAttribute('aria-pressed', String(mode === 'grid'));
        gridBtn.className = `relative z-10 w-[32px] h-[32px] inline-flex items-center justify-center rounded-[7.5px] transition-colors ml-[2px] cursor-pointer focus:outline-none ${
          mode === 'grid' ? 'text-ink' : 'text-meta hover:text-ink'
        }`;
      }
      renderDirectory(true);
    }

    // ==================== 双语全字段检索 & 目录渲染 ====================
    function getFilteredEntries() {
      const q = state.query.trim().toLowerCase();
      return ENTRIES.filter(item => {
        const matchTopic = state.topic === '全部' || item.topic === state.topic;
        const matchFormat = state.format === 'all' || (state.format === 'video' ? item.format === 'video' : item.format !== 'video');
        if (!matchTopic || !matchFormat) return false;
        if (!q) return true;
        const other = language === 'en' ? ORIGINAL.get(item.id) : ENGLISH[item.id];
        const haystack = [
          item.title, item.summary, item.topic, ...(item.tags || []), ...(item.content || []),
          other?.title, other?.summary, ...(other?.content || []), tr(item.topic), ...(item.tags || []).map(tr)
        ].join(' ').toLowerCase();
        return haystack.includes(q);
      });
    }

    function renderDirectory(animate) {
      const container = document.getElementById('directoryContainer');
      if (!container) return;

      const filtered = getFilteredEntries();
      const totalEl = document.getElementById('totalCountText');
      if (totalEl) totalEl.textContent = String(ENTRIES.length);

      if (animate) {
        container.classList.remove('list-animate');
        void container.offsetWidth;
        container.classList.add('list-animate');
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-16 text-center">
            <p class="text-[14px] text-secondary">${tr('没有找到符合条件的记录')}</p>
            <button
              type="button"
              onclick="resetAllFilters()"
              class="mt-3 text-[12.5px] font-medium text-[var(--accent)] hover:underline cursor-pointer"
            >${tr('重置全部筛选')}</button>
          </div>
        `;
        return;
      }

      if (state.viewMode === 'list') {
        container.innerHTML = `
          <ul class="space-y-0.5">
            ${filtered.map(item => {
              const displayDate = formatDisplayDate(item.date, false);
              const badgeHtml = item.badge
                ? `<span class="inline-flex items-center px-[7px] py-[2px] rounded-full bg-badgeBg text-badgeText text-[10.5px] font-medium leading-[1.35] whitespace-nowrap shrink-0">${tr(item.badge)}</span>`
                : '';
              return `
                <li>
                  <button
                    type="button"
                    onclick="openReader('${item.id}')"
                    class="entry-row group focus:outline-none"
                  >
                    <div class="entry-row-main">
                      <span class="entry-row-title font-medium text-ink group-hover:text-[var(--link-hover)] transition-colors tracking-editorial">${item.title}</span>
                      <span class="entry-row-summary-inline">${item.summary}</span>
                      <span class="entry-row-mobile-date">
                        ${badgeHtml}
                        <span class="text-[11.5px] text-meta tabular-nums whitespace-nowrap">${displayDate}</span>
                      </span>
                    </div>
                    <p class="entry-row-mobile-summary">${item.summary}</p>
                    <div class="entry-row-desktop-meta flex items-center gap-2.5 shrink-0">
                      ${badgeHtml}
                      <span class="text-[12px] text-meta tabular-nums whitespace-nowrap shrink-0 min-w-[44px] text-right tracking-tight">${displayDate}</span>
                    </div>
                  </button>
                </li>
              `;
            }).join('')}
          </ul>
        `;
      } else {
        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-7 pt-1.5">
            ${filtered.map(item => {
              const displayDate = formatDisplayDate(item.date, false);
              return `
                <button
                  type="button"
                  onclick="openReader('${item.id}')"
                  class="grid-card text-left group cursor-pointer focus:outline-none"
                >
                  <div class="grid-card-thumb w-full aspect-[16/10] rounded-[11px] overflow-hidden bg-surface">
                    ${buildThumbSvg(item, 'grid')}
                  </div>
                  <div class="mt-2.5 flex items-center justify-between gap-2">
                    <span class="text-[13.5px] font-medium text-ink group-hover:text-[var(--link-hover)] transition-colors truncate tracking-editorial">${item.title}</span>
                    ${
                      item.badge
                        ? `<span class="inline-flex items-center px-[7px] py-[1.5px] rounded-full bg-badgeBg text-badgeText text-[10.5px] font-medium whitespace-nowrap shrink-0">${tr(item.badge)}</span>`
                        : `<span class="text-[12px] text-meta tabular-nums whitespace-nowrap shrink-0">${displayDate}</span>`
                    }
                  </div>
                  <p class="mt-1 text-[12.5px] text-[var(--summary)] line-clamp-2 leading-[1.55]">${item.summary}</p>
                </button>
              `;
            }).join('')}
          </div>
        `;
      }
    }

    function resetAllFilters() {
      state.topic = '全部';
      state.format = 'all';
      state.query = '';
      const input = document.getElementById('searchInput');
      if (input) input.value = '';
      updateSearchAffordance();
      renderTopicNavs(false);
      renderFormatTabs(false);
      renderDirectory(true);
    }

    // ==================== 搜索控制 ====================
    function updateSearchAffordance() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      const slashHint = document.getElementById('searchSlashHint');
      if (!input) return;
      const hasVal = input.value.trim().length > 0;
      if (clearBtn) clearBtn.classList.toggle('hidden', !hasVal);
      if (slashHint) slashHint.classList.toggle('hidden', hasVal);
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = '';
        input.focus();
      }
      state.query = '';
      updateSearchAffordance();
      renderDirectory(true);
    }

    // ==================== 页内沉浸式阅读器 ====================
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function renderReaderPrevNext(item) {
      const idx = ENTRIES.indexOf(item);
      const prev = idx > 0 ? ENTRIES[idx - 1] : null;
      const next = idx < ENTRIES.length - 1 ? ENTRIES[idx + 1] : null;
      document.getElementById('readerPrevNext').innerHTML = `
        ${
          prev
            ? `<button type="button" onclick="openReader('${prev.id}')" class="p-3.5 rounded-[12px] bg-surface hover:bg-[var(--surface-hover)] text-left transition-colors cursor-pointer group focus:outline-none">
                 <div class="text-[11px] text-meta">${tr('← 上一篇')}</div>
                 <div class="mt-1 text-[13.5px] font-medium text-ink group-hover:text-[var(--link-hover)] truncate transition-colors">${prev.title}</div>
               </button>`
            : '<div class="hidden sm:block"></div>'
        }
        ${
          next
            ? `<button type="button" onclick="openReader('${next.id}')" class="p-3.5 rounded-[12px] bg-surface hover:bg-[var(--surface-hover)] text-left sm:text-right transition-colors cursor-pointer group focus:outline-none">
                 <div class="text-[11px] text-meta">${tr('下一篇 →')}</div>
                 <div class="mt-1 text-[13.5px] font-medium text-ink group-hover:text-[var(--link-hover)] truncate transition-colors">${next.title}</div>
               </button>`
            : '<div class="hidden sm:block"></div>'
        }
      `;
    }

    function populateReader(item, resetVideo) {
      document.title = `${item.title} — QQiang.`;
      const formatLabel = tr(item.format === 'video' ? '视频' : '文字');
      document.getElementById('readerMetaRight').innerHTML = `<span>${formatLabel}</span><span>·</span><span>${formatDisplayDate(item.date, true)}</span>`;
      document.getElementById('readerTags').innerHTML = `
        <span class="px-2.5 py-0.5 rounded-full text-[11.5px] font-medium bg-badgeBg text-badgeText">${tr(item.topic)}</span>
        ${(item.tags || []).map(tag => `<span class="text-[12px] text-secondary">${tr(tag)}</span>`).join('')}
      `;
      document.getElementById('readerTitle').textContent = item.title;
      document.getElementById('readerSummary').textContent = item.summary;

      const videoWrap = document.getElementById('videoPlayerWrap');
      const nativeVideo = document.getElementById('nativeVideo');
      const placeholder = document.getElementById('videoPlaceholder');
      videoWrap.classList.toggle('hidden', item.format !== 'video');
      nativeVideo.classList.toggle('hidden', !item.videoUrl);
      placeholder.classList.toggle('hidden', !!item.videoUrl);
      if (item.format === 'video') {
        if (resetVideo && item.videoUrl) nativeVideo.src = item.videoUrl;
        renderVideoChapters(item.chapters || [], !!item.videoUrl);
        document.getElementById('videoChaptersWrap').classList.toggle('hidden', !item.chapters?.length);
      }

      document.getElementById('readerBody').innerHTML = (item.content || []).map(p => `<p>${p}</p>`).join('');
      renderReaderPrevNext(item);
    }

    function openReader(entryId, fromHistory = false) {
      const item = ENTRIES.find(e => e.id === entryId);
      if (!item) return;

      closePlatformPopover();
      stopVideoPlayback();

      if (!state.activeEntryId) state.directoryScroll = window.scrollY;
      state.activeEntryId = entryId;
      if (!fromHistory && location.hash !== `#note/${entryId}`) {
        try { history.pushState(null, '', `#note/${entryId}`); } catch (e) { location.hash = `#note/${entryId}`; }
      }

      document.getElementById('directoryView')?.classList.add('hidden');
      document.getElementById('fanHeader')?.classList.add('hidden');
      document.getElementById('desktopLeftNav')?.classList.add('in-reader');
      document.getElementById('surpriseWrap')?.classList.add('hidden');

      const readerView = document.getElementById('readerView');
      if (readerView) {
        readerView.classList.remove('hidden', 'list-animate');
        void readerView.offsetWidth;
        readerView.classList.add('list-animate');
      }
      const progressBar = document.getElementById('readingProgressBar');
      if (progressBar) {
        progressBar.style.opacity = '1';
        progressBar.style.width = '0%';
      }

      populateReader(item, true);
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function closeReader(fromHistory = false) {
      stopVideoPlayback();
      state.activeEntryId = null;
      if (!fromHistory && location.hash) {
        try { history.pushState(null, '', location.href.split('#')[0]); } catch (e) { location.hash = ''; }
      }
      document.title = tr('QQiang. — 吃、喝、玩、乐、睡');

      document.getElementById('readerView')?.classList.add('hidden');
      document.getElementById('directoryView')?.classList.remove('hidden');
      document.getElementById('fanHeader')?.classList.remove('hidden');
      document.getElementById('desktopLeftNav')?.classList.remove('in-reader');
      document.getElementById('surpriseWrap')?.classList.remove('hidden');

      const progressBar = document.getElementById('readingProgressBar');
      if (progressBar) {
        progressBar.style.opacity = '0';
        progressBar.style.width = '0%';
      }

      requestAnimationFrame(() => {
        updateDesktopTopicDot(true);
        updateFormatPill(true);
        updateMobileTopicPill(true);
        window.scrollTo({ top: state.directoryScroll || 0, behavior: 'instant' });
      });
    }

    function openRandomEntry() {
      const pool = getFilteredEntries();
      const source = pool.length > 0 ? pool : ENTRIES;
      const candidates = source.length > 1 ? source.filter(e => e.id !== state.activeEntryId) : source;
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      if (pick) openReader(pick.id);
    }

    function renderVideoChapters(chapters, playable) {
      document.getElementById('videoChapterList').innerHTML = chapters.map(ch => (
        playable
          ? `<button type="button" class="w-full flex gap-3 py-2 text-left text-[13px] text-secondary hover:text-ink transition-colors cursor-pointer" onclick="document.getElementById('nativeVideo').currentTime=${ch.time}"><span class="text-[var(--accent)] tabular-nums">${formatTime(ch.time)}</span><span>${ch.label}</span></button>`
          : `<div class="flex gap-3 py-1.5 text-[13px] text-secondary"><span class="text-meta tabular-nums">${formatTime(ch.time)}</span><span>${ch.label}</span></div>`
      )).join('');
    }

    function stopVideoPlayback() {
      const video = document.getElementById('nativeVideo');
      if (video && video.getAttribute('src')) {
        video.pause();
        video.removeAttribute('src');
        video.load();
      }
    }

    // ==================== 联系我浮出卡片 ====================
    function renderPlatformLinks() {
      const list = document.getElementById('platformLinksList');
      if (!list) return;
      list.innerHTML = PLATFORMS.map((p, i) => `
        <a
          href="${p.url}"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center justify-between gap-3 px-2.5 py-2 rounded-[9px] hover:bg-rowhover transition-colors group"
        >
          <div class="min-w-0">
            <div class="text-[13px] font-medium text-ink group-hover:text-[var(--link-hover)] transition-colors">${language === 'en' ? PLATFORM_EN[i][0] : p.name}</div>
            <div class="text-[11.5px] text-meta truncate">${language === 'en' ? PLATFORM_EN[i][1] : p.desc}</div>
          </div>
          <span class="text-[11.5px] font-medium text-secondary group-hover:text-[var(--accent)] shrink-0 transition-colors">${tr('平台首页 ↗')}</span>
        </a>
      `).join('');
    }

    function positionContactPopover() {
      const pop = document.getElementById('contactPopover');
      const mainWrap = document.querySelector('main');
      if (!pop || !mainWrap) return;

      if (window.innerWidth >= 1180) {
        const rect = mainWrap.getBoundingClientRect();
        const left = Math.min(rect.right + 28, window.innerWidth - 352);
        const top = Math.max(76, Math.min(180, window.innerHeight - 540));
        pop.style.left = `${left}px`;
        pop.style.top = `${top}px`;
        pop.style.transform = state.popoverOpen ? 'translateY(0) scale(1)' : 'translateY(8px) scale(0.97)';
      } else {
        pop.style.left = '50%';
        pop.style.top = '50%';
        pop.style.transform = state.popoverOpen
          ? 'translate(-50%, -50%) scale(1)'
          : 'translate(-50%, -46%) scale(0.97)';
      }
    }

    function togglePlatformPopover(event) {
      if (event) event.stopPropagation();
      if (state.popoverOpen) closePlatformPopover();
      else openPlatformModal();
    }

    function openPlatformModal() {
      state.popoverOpen = true;
      const pop = document.getElementById('contactPopover');
      const backdrop = document.getElementById('contactBackdrop');
      const trigger = document.getElementById('contactTriggerBtn');

      if (backdrop) backdrop.classList.remove('hidden');
      if (trigger) trigger.classList.add('is-open');
      if (pop) {
        pop.classList.add('is-open');
        positionContactPopover();
      }
    }

    function closePlatformPopover() {
      state.popoverOpen = false;
      const pop = document.getElementById('contactPopover');
      const backdrop = document.getElementById('contactBackdrop');
      const trigger = document.getElementById('contactTriggerBtn');

      if (backdrop) backdrop.classList.add('hidden');
      if (trigger) trigger.classList.remove('is-open');
      if (pop) {
        pop.classList.remove('is-open');
        positionContactPopover();
      }
    }

    // ==================== 复制文本与轻提示 ====================
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toastNotice');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    function copyText(text, label) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(language === 'en' ? `Copied ${tr(label)}: ${text}` : `已复制${label}：${text}`);
      } catch (err) {
        showToast(language === 'en' ? `Copy manually: ${text}` : `请手动复制：${text}`);
      }
      document.body.removeChild(ta);
    }

    // ==================== 双语切换引擎 + 东方卷轴青雾光帘过渡 ====================
    const staticText = [];
    const staticAttrs = [];

    function updateLangActiveBar(instant) {
      const bar = document.getElementById('langActiveBar');
      const activeBtn = document.getElementById(language === 'en' ? 'langEn' : 'langZh');
      if (!bar || !activeBtn || activeBtn.offsetWidth === 0) return;

      const x = activeBtn.offsetLeft;
      const w = activeBtn.offsetWidth;
      if (instant) {
        const prev = bar.style.transition;
        bar.style.transition = 'none';
        bar.style.width = `${w}px`;
        bar.style.transform = `translate3d(${x}px, 0, 0)`;
        bar.style.opacity = '0.85';
        void bar.offsetWidth;
        bar.style.transition = prev;
      } else {
        bar.style.width = `${w}px`;
        bar.style.transform = `translate3d(${x}px, 0, 0)`;
        bar.style.opacity = '0.85';
      }
    }

    function captureStatic() {
      const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
        acceptNode: n => (n.parentElement.closest('script,style') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT)
      });
      while (walk.nextNode()) {
        const n = walk.currentNode;
        const k = n.nodeValue.trim();
        if (WORDS[k]) staticText.push([n, n.nodeValue, k]);
      }
      document.querySelectorAll('[aria-label],[title],[placeholder],[alt]').forEach(el => {
        ['aria-label', 'title', 'placeholder', 'alt'].forEach(attr => {
          const v = el.getAttribute(attr);
          if (v && WORDS[v]) staticAttrs.push([el, attr, v]);
        });
      });
    }

    function applyLanguage(instantSync = true) {
      document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
      staticText.forEach(([n, original, k]) => {
        n.nodeValue = language === 'en' ? original.replace(k, WORDS[k]) : original;
      });
      staticAttrs.forEach(([el, a, v]) => el.setAttribute(a, tr(v)));
      document.getElementById('langZh')?.setAttribute('aria-pressed', String(language === 'zh'));
      document.getElementById('langEn')?.setAttribute('aria-pressed', String(language === 'en'));
      updateLangActiveBar(instantSync);

      localizeEntries();
      renderFanCards();
      renderTopicNavs(instantSync);
      renderFormatTabs(instantSync);
      renderPlatformLinks();
      renderDirectory(false);

      if (state.activeEntryId) {
        const item = ENTRIES.find(e => e.id === state.activeEntryId);
        if (item) populateReader(item, false);
      } else {
        document.title = tr('QQiang. — 吃、喝、玩、乐、睡');
      }

      if (state.popoverOpen) positionContactPopover();
    }

    function setLanguage(next) {
      if (next === language || languageBusy) return;
      languageBusy = true;
      handleFanLeave();

      const root = document.documentElement;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const y = window.scrollY;
      const inReader = !!state.activeEntryId;
      const max = Math.max(1, root.scrollHeight - window.innerHeight);
      const ratio = y / max;
      const filter = document.getElementById('directoryFilters');
      const filterY = filter ? filter.getBoundingClientRect().top : 0;
      const dir = document.getElementById('directoryView');
      const veil = document.getElementById('langSweepVeil');
      const dirClass = next === 'en' ? 'lang-ltr' : 'lang-rtl';
      let committed = false;

      const commit = () => {
        if (committed) return;
        committed = true;
        language = next;
        try { localStorage.setItem('qqiang_language', next); } catch (e) {}
        applyLanguage(true);
        if (veil) veil.classList.add('is-visible');
        if (!inReader && dir && filter && dir.classList.contains('topic-jumped')) {
          dir.style.setProperty('--filter-offset', `${filter.getBoundingClientRect().top - dir.getBoundingClientRect().top}px`);
        }
        const target = inReader
          ? ratio * Math.max(0, root.scrollHeight - window.innerHeight)
          : (y > 0 && filter ? window.scrollY + filter.getBoundingClientRect().top - filterY : 0);
        window.scrollTo({ top: Math.max(0, target), behavior: 'instant' });
      };

      if (reduce || !document.startViewTransition) {
        try {
          commit();
          if (veil) veil.classList.remove('is-visible');
          if (!reduce) {
            const mainEl = document.querySelector('main');
            if (mainEl) {
              mainEl.classList.remove('lang-fallback-in');
              void mainEl.offsetWidth;
              mainEl.classList.add('lang-fallback-in');
            }
          }
        } finally {
          languageBusy = false;
        }
        return;
      }

      let finished = false;
      const cleanup = () => {
        if (finished) return;
        finished = true;
        if (veil) veil.classList.remove('is-visible');
        root.classList.remove('language-sweep', 'lang-ltr', 'lang-rtl');
        languageBusy = false;
      };

      try {
        root.classList.add('language-sweep', dirClass);
        const transition = document.startViewTransition(commit);
        transition.finished.then(cleanup, () => {
          try { commit(); } finally { cleanup(); }
        });
      } catch (e) {
        try { commit(); } finally { cleanup(); }
      }
    }

    function toggleLanguageQuick() {
      setLanguage(language === 'zh' ? 'en' : 'zh');
    }

    // ==================== 初始化与路由同步 ====================
    function init() {
      try {
        const saved = localStorage.getItem('qqiang_theme');
        if (saved === 'dark') applyThemeAttr('dark');
      } catch (e) {}

      captureStatic();
      applyLanguage(true);

      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        updateSearchAffordance();
        searchInput.addEventListener('input', e => {
          state.query = e.target.value;
          updateSearchAffordance();
          renderDirectory(false);
        });
      }

      // 全局快捷键：/ 搜索、Esc 返回/关闭、D 切换黑白、L 切换中英文
      document.addEventListener('keydown', e => {
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        const isTyping = tag === 'INPUT' || tag === 'TEXTAREA';

        if (e.key === '/' && !isTyping && !state.activeEntryId) {
          e.preventDefault();
          searchInput?.focus();
        } else if (e.key === 'Escape') {
          if (state.popoverOpen) closePlatformPopover();
          else if (isTyping && searchInput && searchInput.value) clearSearch();
          else if (isTyping) searchInput?.blur();
          else if (state.activeEntryId) closeReader();
        } else if ((e.key === 'd' || e.key === 'D') && !isTyping && !e.metaKey && !e.ctrlKey) {
          toggleThemeQuick();
        } else if ((e.key === 'l' || e.key === 'L') && !isTyping && !e.metaKey && !e.ctrlKey) {
          toggleLanguageQuick();
        }
      });

      window.addEventListener('scroll', () => {
        if (!state.activeEntryId) return;
        const docH = document.documentElement.scrollHeight - window.innerHeight;
        const pct = docH > 0 ? Math.min(100, (window.scrollY / docH) * 100) : 0;
        const bar = document.getElementById('readingProgressBar');
        if (bar) bar.style.width = `${pct}%`;
      }, { passive: true });

      window.addEventListener('resize', () => {
        const directory = document.getElementById('directoryView');
        const filters = document.getElementById('directoryFilters');
        if (directory?.classList.contains('topic-jumped') && !state.activeEntryId && filters) {
          directory.style.setProperty('--filter-offset', `${filters.getBoundingClientRect().top - directory.getBoundingClientRect().top}px`);
        }
        updateDesktopTopicDot(true);
        updateFormatPill(true);
        updateMobileTopicPill(true);
        updateLangActiveBar(true);
        if (state.popoverOpen) positionContactPopover();
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          updateDesktopTopicDot(true);
          updateFormatPill(true);
          updateMobileTopicPill(true);
          updateLangActiveBar(true);
        });
      }
    }

    function syncRoute() {
      const id = location.hash.startsWith('#note/') ? location.hash.slice(6) : '';
      if (id && ENTRIES.some(e => e.id === id)) {
        if (state.activeEntryId !== id) openReader(id, true);
      } else if (state.activeEntryId) {
        closeReader(true);
      }
    }

    window.addEventListener('popstate', syncRoute);
    window.addEventListener('hashchange', syncRoute);
    window.addEventListener('DOMContentLoaded', () => {
      init();
      syncRoute();
    });
  </script>
</body>
</html>
