.fd27-workspace{max-width:950px;margin:0 auto;background:#fbfbf8;border:1px solid #dddcd5;padding:clamp(22px,4vw,53px)}
.fd27-intro{margin-bottom:37px}.fd27-intro h2{font:400 var(--type-h3)/1.35 var(--display);letter-spacing:-.035em;margin:0 0 13px}
.fd27-intro p{font-size:var(--type-body);line-height:1.9;color:var(--secondary);margin:0}
.fd27-source{border-top:1px solid #dbded8;border-bottom:1px solid #dbded8;display:flex;justify-content:space-between;align-items:center;padding:20px 0;gap:15px}
.fd27-file{display:flex;align-items:center;min-width:0;gap:17px}.fd27-file>div:last-child{min-width:0}
.fd27-icon{display:grid;place-items:center;background:#e1ebe3;color:#345845;width:48px;height:52px;font-size:var(--type-lead);font-weight:600;flex-shrink:0}
.fd27-file strong,.fd27-file span{display:block;overflow-wrap:anywhere}.fd27-file strong{font-size:var(--type-body);font-weight:500;line-height:1.5}.fd27-file span{font-size:var(--type-ui);color:var(--secondary);line-height:1.8}
.fd27-source button,.fd27-plain{background:transparent;border:0;border-bottom:1px solid #778178;color:#34483b;padding:8px 0;font-size:var(--type-ui);white-space:nowrap}
.fd27-drop{border:1px dashed #b6bcb2;color:#616c62;text-align:center;padding:19px 16px;font-size:var(--type-ui);cursor:pointer;margin-top:20px;outline-offset:4px}
.fd27-drop:hover,.fd27-drop.dragover{background:#eef3ed;border-color:#6e826e}
.fd27-steps{display:flex;gap:21px;align-items:center;color:#526457;font-size:var(--type-ui);margin:28px 0}
.fd27-actions{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.fd27-primary{border:1px solid #253d30;background:#253d30;color:#fff;min-height:51px;padding:10px 23px;display:inline-flex;gap:24px;justify-content:space-between;align-items:center;font-size:var(--type-ui);line-height:1.4;text-decoration:none}
.fd27-primary:hover{background:#385740}.fd27-primary:disabled{opacity:.45;cursor:not-allowed}
.fd27-status{color:#55705a;font-size:var(--type-ui);line-height:1.7;min-height:20px;margin:18px 0 0}
.fd27-status.error{color:#a04436}.fd27-result{border-top:1px solid #d9dfd8;margin-top:20px;padding-top:28px}
.fd27-result[hidden]{display:none}
.fd27-result-header{display:flex;justify-content:space-between;gap:20px;align-items:baseline;margin-bottom:16px}
.fd27-result-header h3{font:400 var(--type-h3)/1.5 var(--display);margin:0}.fd27-result-header p{font-size:var(--type-ui);color:var(--secondary);margin:0}
.fd27-preview{overflow-x:auto;max-height:350px;overflow-y:auto;border:1px solid #dfe3dc;background:#fff;margin-bottom:23px}
.fd27-preview table{border-collapse:collapse;width:100%;min-width:590px;font-size:var(--type-ui);line-height:1.6}
.fd27-preview th,.fd27-preview td{text-align:left;padding:10px 13px;border:1px solid #e3e8e1;white-space:nowrap}
.fd27-preview th{font-weight:500;background:#ecf2eb;position:sticky;top:0}
.fd27-preview p{padding:15px;font-size:var(--type-ui)}
@media(max-width:750px){.fd27{padding:11px}.fd27-workspace{padding:22px 18px}.fd27-intro{margin-bottom:23px}.fd27-intro h2{font-size:var(--type-subhead)}.fd27-source{align-items:flex-start}.fd27-file{gap:10px}.fd27-icon{width:40px;height:46px}.fd27-source button{font-size:var(--type-ui)}.fd27-file strong{font-size:var(--type-ui)}.fd27-result-header{display:block}.fd27-result-header p{margin-top:6px}}

/* V2.8 — Seven projects, restrained editorial image treatment. */
.detail-image-link{display:block;outline-offset:4px}
.asset-elementcopy{background:#eeefeb}
.asset-elementcopy img{max-height:535px;width:auto;max-width:100%;object-fit:contain;box-shadow:0 12px 30px rgba(28,40,31,.035)}
.asset-gestureflow{background:#eeeae3}
.asset-gestureflow img{max-height:520px;max-width:100%;object-fit:contain;box-shadow:0 13px 31px rgba(28,40,31,.045)}
.case-showcase .asset-elementcopy img{max-height:610px}
.case-showcase .asset-gestureflow img{max-height:600px}
@media(max-width:750px){.asset-elementcopy img,.asset-gestureflow img{max-height:350px}.case-showcase .asset-elementcopy img,.case-showcase .asset-gestureflow img{max-height:430px}}


/* V2.9.0 — A case-study is content, not ornamental slogans. */
.site-footer .foot-top{border:0;padding:0;background:none;font:inherit;color:var(--secondary);cursor:pointer;line-height:inherit}
.site-footer .foot-top:hover{text-decoration:underline;text-underline-offset:4px}
.case-top{padding:56px 0 54px}
.case-head{grid-template-columns:minmax(0,.82fr) minmax(0,1.1fr);gap:9%;align-items:center;padding-top:64px}
.case-head .case-lead{max-width:640px;padding:0;margin:0;font-size:var(--type-lead);line-height:1.9;color:#454d45}
.case-head .en-name{margin-top:5px}
.case-story{padding:80px 0 84px}
.case-story-text{max-width:780px;margin-left:auto;margin-right:auto}
.case-story p{font-size:var(--type-body);line-height:2.05;color:var(--secondary);margin:0 0 26px}
.case-story p:last-child{margin-bottom:0}
.case-next{padding:55px 0 88px;border-top:1px solid var(--line)}
.case-next .next-name{font-size:var(--type-page);line-height:1.5}
.case-next .back-all{font-size:var(--font-ui);white-space:nowrap;border-bottom:1px solid var(--line);padding-bottom:5px}
@media(max-width:750px){
  .case-top{padding:43px 0 35px}
  .case-head{grid-template-columns:1fr;gap:20px;padding-top:44px}
  .case-head .case-lead{font-size:var(--type-body);line-height:1.9;max-width:100%}
  .case-story{padding:52px 0 62px}
  .case-story p{font-size:var(--type-ui);line-height:2;margin-bottom:20px}
  .case-next{padding:41px 0 66px;align-items:flex-start;flex-direction:column;gap:23px}
  .case-next .next-name{font-size:var(--type-h3)}
}


/* V2.9.0 — single, audited typography system. No view-level ad-hoc sizes. */
:root{--type-reading:var(--type-body);--type-reading-leading:1.94}
.hero-title{font-size:var(--type-hero)}
.brand,.site-footer .name{font-size:var(--type-lead)}
.hero-aside p,.about-body p,.feature-description,.case-head .case-lead,
.case-story p,.article-body p,.inner-intro .subline,.lab-desc,
.work-more p,.detail-demo-head p,.fd27-intro p {font-family:var(--text);font-size:var(--type-reading);line-height:var(--type-reading-leading);font-weight:400;letter-spacing:0;color:var(--secondary)}
.hero-aside{max-width:385px}
.hero-aside p{margin:0 0 28px}
.about-body p{margin-bottom:24px}
.case-head .case-lead{max-width:630px}
.case-story p{max-width:750px}
.case-head h1,.inner-intro h1{font-size:var(--type-page)}
.section-title,.about-big,.feature-title,.case-textblock h2,.case-next .next-name,.closing h2{font-size:var(--type-section)}
.article-head h1,.notes-row h2,.case-story h2{font-size:var(--type-section)}
.works-row .wcn,.fd27-intro h2,.detail-demo-head h2,.demo-browser-greet{font-size:var(--type-h3)}
.case-head .en-name{font-size:var(--type-lead)}
.feature-category,.feature-en,.works-row .wen,.works-row .wcategory,.text-link,
.nav a,.case-back,.filter,.site-footer,.foot-right,.case-next .back-all,
.reel-actions button{font-size:var(--type-ui)}
@media(max-width:750px){
  :root{--type-body:17px;--type-lead:19px;--type-h3:30px;--type-section:clamp(35px,7vw,43px);--type-page:clamp(49px,10vw,65px);--type-hero:clamp(49px,11vw,70px)}
  .hero-title{font-size:var(--type-hero)}
  .hero-aside p,.about-body p,.feature-description,.case-head .case-lead,.case-story p,.article-body p,.inner-intro .subline,.lab-desc,.fd27-intro p{font-size:var(--type-reading);line-height:var(--type-reading-leading)}
  .feature-title,.section-title,.about-big,.case-next .next-name{font-size:var(--type-section)}
}
/* Animated portfolio film: restrained, visual-first, accessible, no endless looping. */
.reel-shell{border:1px solid var(--line);background:#f1f2ed}
.reel-top,.reel-bottom{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:17px 26px}
.reel-top{border-bottom:1px solid var(--line)}
.reel-brand{font:500 var(--type-ui)/1.5 var(--text)}
.reel-counter{font:400 var(--type-caption)/1.5 var(--text);color:var(--secondary)}
.reel-viewport{min-height:450px;position:relative;overflow:hidden;display:grid;place-items:center;padding:45px 25px;background:#eff1ec}
.reel-viewport[data-reel=pond]{background:#dce8dc}
.reel-viewport[data-reel=pageshot]{background:#eeeae4}
.reel-viewport[data-reel=yijian]{background:#e5ebe7}
.reel-viewport[data-reel=filedesk]{background:#e7e9e5}
.reel-viewport[data-reel=gestureflow]{background:#e7ebec}
.reel-viewport[data-reel=elementcopy]{background:#eceeea}
.reel-scene{width:100%;display:grid;place-items:center;min-height:330px;animation:reel-appear .52s ease both}
@keyframes reel-appear{from{opacity:.35;transform:translateY(9px)}to{opacity:1;transform:none}}
.reel-board{width:min(100%,710px);min-height:300px;display:grid;place-items:center;position:relative;gap:15px}
.reel-panel{background:#fbfcf9;border:1px solid #ced5cc;padding:25px 30px;box-shadow:0 10px 35px #20271a0b;color:var(--ink);width:min(100%,530px)}
.reel-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e1e4de;padding-bottom:13px;margin-bottom:18px;font:500 var(--type-ui)/1.5 var(--text)}
.reel-file{background:#fff;border:1px solid #d5dcd3;padding:16px 20px;display:flex;align-items:center;gap:15px;width:min(100%,395px);font:500 var(--type-ui)/1.6 var(--text)}
.reel-file-icon{width:47px;height:52px;background:#dbe8de;color:#365c41;display:grid;place-items:center;font-size:var(--type-lead);font-weight:600;flex:none}
.reel-file-icon.word{background:#dfe5f1;color:#415a7d}
.reel-file .reel-detail{display:block;color:var(--secondary);font:400 var(--type-caption)/1.65 var(--text)}
.reel-dropzone{border:1px dashed #879e8b;padding:28px;display:grid;place-items:center;gap:13px;width:min(100%,540px);background:#f9fbf8}

.reel-arrow{color:#697a6c;font-size:var(--type-subhead);line-height:1}
.reel-output{display:flex;align-items:center;justify-content:center;gap:25px;flex-wrap:wrap}
.reel-table{border-collapse:collapse;background:white;font:400 var(--type-caption)/1.5 var(--text)}
.reel-table th,.reel-table td{border:1px solid #d2d9ce;padding:9px 12px;text-align:left}
.reel-table th{background:#e7eee5}
.reel-success{color:#366849;font:500 var(--type-ui)/1.5 var(--text)}
.reel-pill{font:500 var(--type-ui)/1.5 var(--text);background:#e5ebe5;border:1px solid #d3dfd3;padding:9px 17px;color:#3c5843}
.reel-label{font:400 var(--type-caption)/1.5 var(--text);color:#687569}
.reel-title{font:400 var(--type-h3)/1.5 var(--display);text-align:center;letter-spacing:-.03em}
.reel-browser{width:min(100%,650px);min-height:260px;background:#fcfcf9;border:1px solid #cfd6ce;box-shadow:0 15px 40px #303b300a}
.reel-browser-bar{height:42px;border-bottom:1px solid #e3e5df;display:flex;align-items:center;gap:8px;padding:0 18px;color:#7c857b;font-size:var(--type-caption)}
.reel-dot{width:8px;height:8px;border-radius:50%;background:#c6cec3}

.reel-tags{display:flex;gap:9px;flex-wrap:wrap}

.reel-tag.active{border-color:#8fac94;background:#e4efe5}
.reel-screen{width:min(100%,540px);height:265px;background:#fff;border:1px solid #d6d9d1;position:relative;padding:26px;overflow:hidden}
.reel-screen-lines{display:grid;gap:11px;width:77%}.reel-screen-lines i{display:block;height:10px;background:#e5eae3}.reel-screen-lines i:nth-child(2){width:90%}.reel-screen-lines i:nth-child(3){width:62%}
.reel-selection{position:absolute;left:23%;top:18%;width:61%;height:55%;border:2px solid #af7c65;background:#af7c6514;animation:reel-select .8s ease both}
@keyframes reel-select{from{width:3%;height:3%;opacity:.2}to{width:61%;height:55%;opacity:1}}
.reel-annotation{position:absolute;left:31%;top:42%;width:45%;height:0;border-top:3px solid #ad7860;transform:rotate(-20deg);animation:reel-appear .7s both}
.reel-english{font:400 var(--type-subhead)/1.7 var(--text);max-width:600px;margin:0}
.reel-translation{font:400 var(--type-lead)/1.8 var(--text);color:#385b42;border-top:1px solid #d3dfd3;margin-top:24px;padding-top:20px}
.reel-highlight{background:linear-gradient(transparent 55%,#d5dfce 55%)}
.reel-mouse{width:60px;height:70px;border:2px solid #65796e;border-radius:28px;position:relative;transform:rotate(-9deg);animation:reel-pointer 1.5s ease-in-out infinite alternate}
.reel-mouse:before{content:'';height:23px;position:absolute;left:50%;top:0;border-left:1px solid #65796e}
@keyframes reel-pointer{from{transform:translate(-25px,12px) rotate(-9deg)}to{transform:translate(25px,-10px) rotate(7deg)}}
.reel-route{width:250px;height:125px;max-width:100%}
.reel-route path{stroke:#667d70;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:350;stroke-dashoffset:350;animation:reel-draw 1.55s ease forwards}
@keyframes reel-draw{to{stroke-dashoffset:0}}
.reel-pond-svg{width:min(100%,570px);height:280px;overflow:visible}
.reel-swim{animation:reel-swim 2.5s ease-in-out infinite alternate;transform-origin:center}
@keyframes reel-swim{to{transform:translateX(38px) rotate(9deg)}}
.reel-ripples{transform-origin:center;animation:reel-ripples 1.8s ease-out infinite}
@keyframes reel-ripples{from{opacity:.85;transform:scale(.45)}to{opacity:0;transform:scale(1.6)}}
.reel-bottom{padding-top:24px;padding-bottom:21px;align-items:flex-start}
.reel-step-caption{font:400 var(--type-body)/1.6 var(--text);max-width:640px}
.reel-controls{display:flex;align-items:center;gap:15px;white-space:nowrap}
.reel-controls button,.reel-actions button{border:0;background:transparent;border-bottom:1px solid var(--ink);color:var(--ink);padding:3px 0;line-height:1.6;font:400 var(--type-ui)/1.6 var(--text)}
.reel-progress{height:2px;background:#dde2db;position:relative}
.reel-progress i{display:block;height:100%;background:#596e5a;transition:width .35s linear}
.reel-actions{display:flex;gap:32px;align-items:center;padding:29px 0 36px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.reel-details{margin:0 0 30px}
.reel-details[hidden]{display:none}
.reel-gallery{border:1px solid var(--line);background:#ebeee8;padding:34px;display:grid;place-items:center;gap:15px}
.reel-gallery img{display:block;max-width:100%;max-height:550px;object-fit:contain}
.reel-gallery-row{display:flex;gap:12px;align-items:center;justify-content:center}
.reel-gallery-row button{font:400 var(--type-ui)/1.4 var(--text);background:none;border:0;border-bottom:1px solid #546a58;padding:3px 0}
.reel-story-note{color:var(--secondary);font:400 var(--type-ui)/1.7 var(--text)}
@media(max-width:750px){.reel-viewport{min-height:330px;padding:16px}.reel-scene{min-height:260px}.reel-board{min-height:245px}.reel-panel{padding:17px}.reel-top,.reel-bottom{padding:13px 14px}.reel-title{font-size:var(--type-subhead)}.reel-screen{height:240px}.reel-file{padding:10px;gap:8px}.reel-dropzone{padding:17px}.reel-browser-body{padding:17px 13px}.reel-tag{padding:8px}.reel-bottom{flex-direction:column;gap:15px}.reel-step-caption{font-size:var(--type-body)}.reel-pond-svg{height:210px}.reel-progress{height:2px}.reel-actions{padding:19px 0 24px}}
@media(prefers-reduced-motion:reduce){.reel-scene,.reel-mouse,.reel-route path,.reel-swim,.reel-ripples,.reel-selection,.reel-annotation{animation:none!important}.reel-progress i{transition:none}}

/* V2.9 — uninterrupted operations, not numbered instructional slides */
.film-shell{border:1px solid var(--line);background:#f5f6f2;overflow:hidden}
.film-stage{height:clamp(390px,47vw,620px);position:relative;overflow:hidden;display:grid;place-items:center;background:#f4f5f1}
.film-footer{padding:0 25px 15px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.film-progress{height:2px;background:#dee3dd;max-width:calc(100% - 85px);width:100%;overflow:hidden}
.film-progress span{height:100%;display:block;width:0;background:#78917e}
.film-controls{display:flex;gap:21px;white-space:nowrap}
.film-controls button{background:none;border:0;font:400 var(--type-ui)/1.5 var(--text);padding:7px 0;color:var(--ink);cursor:pointer}
.film-controls button:focus-visible,.film-github:focus-visible{outline:2px solid #51785b;outline-offset:4px}
.film-cursor{position:absolute;z-index:20;left:22%;top:65%;width:24px;height:30px;pointer-events:none;transition:left 1.35s cubic-bezier(.25,.8,.3,1),top 1.35s cubic-bezier(.25,.8,.3,1);filter:drop-shadow(0 1px 3px #ffffff90)}
.film-cursor svg{width:100%;height:100%}

.film-click.pulse{animation:film-tap .8s ease forwards}@keyframes film-tap{0%{opacity:0;transform:scale(.3)}32%{opacity:.7}100%{opacity:0;transform:scale(1.9)}}
.film-app{width:min(100% - 68px,1060px);height:min(92%,570px);background:#fbfcfa;border:1px solid #dbe1dc;box-shadow:0 15px 50px #10251b0d;overflow:hidden;position:relative}
.film-app-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e7eae6;height:57px;padding:0 25px;color:#223c30;font-size:var(--type-ui)}
.film-app-brand{display:flex;align-items:center;gap:6px;font-weight:600}.film-app-brand>span:not(.film-app-icon){font-size:var(--type-caption);font-weight:400;color:#5e6b63}
.film-app-icon{display:grid;place-items:center;width:27px;height:27px;border-radius:6px;background:#2b5645;color:white;margin-right:7px;font-size:16px}
.film-local{font-size:var(--type-caption);color:#6b7f72}
.fd-film-main{padding:clamp(19px,3.5vw,36px);height:calc(100% - 57px);position:relative}
.fd-film-title{font:400 var(--type-h3)/1.35 var(--display);color:#1e3127;position:relative;z-index:1}
.fd-film-drop{position:absolute;left:27%;top:27%;width:46%;height:52%;border:1px dashed #a6b6aa;background:#f6f8f5;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;color:#40574a;transition:opacity .48s,transform .55s;text-align:center;font-size:var(--type-ui)}
.fd-film-paper{font-size:34px;color:#476c54}.fd-film-drop strong{font-weight:500}.fd-film-drop span{color:#748279}.fd-film-types{font-size:var(--type-caption)!important;margin-top:12px}
.fd-film-dragfile{position:absolute;z-index:4;left:7%;top:60%;background:white;border:1px solid #cdd9ce;box-shadow:0 8px 27px #203a2515;padding:11px 15px;display:flex;gap:9px;align-items:center;white-space:nowrap;opacity:0;font-size:var(--type-caption)}
.fd-film-xls,.fd-film-word{background:#d9eade;color:#28573b;display:grid;place-items:center;width:30px;height:32px;border-radius:4px;flex-shrink:0;font-weight:600}
.fd-film-word{background:#dce6f3;color:#345479}
.film-shell[data-phase="0"] .fd-film-dragfile{animation:fd-film-drag 2.35s ease-in-out forwards}
@keyframes fd-film-drag{0%{left:7%;top:60%;opacity:0}12%{opacity:1}70%{opacity:1}94%{left:45%;top:54%;opacity:1}100%{left:45%;top:54%;opacity:0}}
.fd-film-board{position:absolute;left:3.5%;right:3.5%;top:23%;bottom:9%;display:grid;grid-template-columns:1.22fr 1fr;gap:14px;opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s;pointer-events:none}
.fd-film-pane{border:1px solid #e0e4e0;border-radius:8px;background:#fff;padding:20px;min-width:0}
.fd-film-pane-head{font-size:var(--type-ui);font-weight:500;margin-bottom:23px}.fd-film-pane-head>span{color:#5b8067;background:#e3eee5;padding:1px 6px;border-radius:4px;margin-left:4px}

        {src:'assets/projects/filedesk-preview.webp',alt:'文序 V1.0 PDF 合并预览'},
        {src:'assets/projects/filedesk-result.webp',alt:'文序 V1.0 文件处理完成'}
      ]
    };
    const projects = [
      {slug:'pond',name:'一池清宁',en:'Living Pond',type:'数字体验 · macOS',year:'2026',number:'01',desc:'一方安静的桌面水域。让工作和生活之间，多一个可以短暂停靠的地方。',lead:'一款运行在 macOS 桌面上的小鱼塘。鱼群在水里游动，轻点水面会有涟漪；工作间隙无需完成任务，也能在屏幕上留一小片安静。',story:['屏幕占据了我们大部分清醒时间。它通常承载任务、提醒和不断出现的下一步。于是我想，能不能让桌面上出现一种没有目标的体验：一池水，一群鱼，偶尔落下的细雨。','我更关注它是否让人愿意放慢一点，而不是给它增加多少功能。那些游动、靠近和散开的时刻，应该是自然的，不是提醒用户继续操作的机制。'],quote:'不是每一件作品，都需要让人更高效。',points:[['不过度设计','没有持续夸张的水面特效，只保留恰到好处的细雨与涟漪。'],['群体的生命感','鱼的大小与带领关系让水域拥有自然的节奏，而不是整齐的程序轨迹。'],['陪伴而非干扰','它可以存在于工作之外，也可以安静地陪伴工作。']],visual:'pond',status:'持续打磨'},
      {slug:'yebo',name:'页泊',en:'YEBO',type:'浏览器 · Chrome 扩展',year:'2026',number:'02',desc:'重新组织每一次打开的页面，让浏览器回到安静、有序的状态。',lead:'一款 Chrome 新标签页扩展。把常用书签、正在打开的标签和稍后阅读集中在一个地方，也能用花园模式整理页面，让浏览不再越开越乱。',story:['打开一个网页很容易，但放下它并不容易。标签越积越多，稍后阅读越来越长，有价值的内容被杂乱的窗口淹没。','页泊尝试让这些内容重新拥有秩序：经常用到的内容容易到达，正在进行的任务可以归在一起，暂时无法处理的页面也有合适的停靠位置。'],quote:'好的秩序感，不应该让人感觉自己正在整理。',points:[['低负担入口','新标签页不应该像一个复杂的仪表盘，而应该让下一步清晰可见。'],['自然地归类','把打开的页面、书签与稍后阅读当成同一段浏览体验的不同状态。'],['花园里的想象力','在另一种视图中，用花与花盆重新理解标签页，但不改变功能本身的可靠性。']],visual:'yebo',status:'已发布稳定基线'},
      {slug:'pageshot',name:'页截',en:'PageShot',type:'工具 · Chrome 扩展',year:'2026',number:'03',desc:'从整页截图到标注与保存，让完整的表达发生在一个稳定的画布上。',lead:'一款 Chrome 长截图与标注扩展。截取完整网页后，可以在稳定的画布上圈画、添加箭头或文字、马赛克和裁切，再复制或保存成图片。',story:['截图只是开始。真正影响体验的，是后面的一系列微小动作：裁切、圈出重点、写一句话、调整位置、把内容送到另一个地方。','我希望这些动作自然地发生在同一个空间，不因为选中了某个工具就让画布忽然变宽或变窄，也不为了简单的文字操作增加一次模式切换。'],quote:'工具越被频繁使用，越应该学会退后一步。',points:[['稳定的画布','属性面板以轻量浮层出现，不挤压正在编辑的内容。'],['就地完成','文字输入、拖动与编辑都发生在同一个工具里。'],['快速离开','完成标注后，可以直接复制或保存，无须走多余流程。']],visual:'pageshot',status:'稳定版本 V2.2.1'},
      {slug:'yijian',name:'译见',en:'YiJian',type:'语言工具 · Chrome 扩展',year:'2026',number:'04',desc:'把翻译放在需要的时候，而不是覆盖每一个正在阅读的页面。',lead:'一款按需翻译的 Chrome 扩展。打开网页时保持原文，需要理解时再主动触发划词、段落或整页翻译，也支持邮件回复场景。',story:['阅读外文网页或邮件时，翻译很有帮助。但当它自动覆盖原文、改变排版、抢在读者前面做决定时，帮助就会变成打扰。','译见采用了一个简单而坚定的原则：自动就绪，不自动翻译。划词、段落和整页翻译，都由读者主动触发。'],quote:'好的辅助，是在需要时出现，在不需要时安静。',points:[['保留原文','新网页与新邮件始终先呈现自己的原始内容。'],['主动触发','用户决定翻译的范围和时间，扩展只在旁边准备好。'],['体验一致','网页阅读与邮件回复共享同一套克制、可靠的交互原则。']],visual:'yijian',status:'稳定版本 V1.4.1'},
      {slug:'filedesk',name:'文序',en:'FileDesk',type:'文件工作台 · Web',year:'2026',number:'05',desc:'将 Excel 物料清单转换为结构清楚、可以继续编辑的 Word 文档。',lead:'一个面向真实文件的智能处理工作台。这里可以把旧版 Excel（.xls）、.xlsx 或 CSV 物料清单转换为可编辑的 Word 表格，并检查、下载转换结果。',story:['许多文件工具让用户首先回答技术问题：你需要哪个转换器？选择什么类型？准备点哪个按钮？但用户真正想做的只是拿着一个文件，完成某件事。','文序从文件本身出发，让系统理解可以执行的操作，再以合适的结构交付结果。它也要求排版能被认真对待：正确的内容，要以正确的方式出现。'],quote:'把复杂留在内部，把清楚留给使用者。',points:[['先理解','文件进入后，优先呈现适合它的处理方式。'],['结构优先','可编辑的表格应保留真实结构，而不只是看起来像表格。'],['呈现有序','去掉重复解释和干扰信息，把注意力还给文件和结果。']],visual:'filedesk',status:'持续迭代'},
      {slug:'elementcopy',name:'元素复制',en:'ElementCopy Lite',type:'开发辅助 · Chrome 扩展',year:'2026',number:'06',desc:'选中网页元素，直接把位置、结构和修改要求整理成可交付的任务。',lead:'一个帮你和 AI 准确沟通网页修改任务的 Chrome 扩展。点选页面元素后，可以在原位置写修改要求，一次复制选择器、上下文和任务描述。',story:['和 AI 一起改页面时，沟通中最费力的经常不是修改本身，而是如何准确指出要修改哪个元素。','ElementCopy Lite 将目标元素的定位、上下文和修改要求组合为一条结构化任务。选择器优先可靠，文本和截图保持对应，把反复沟通变成一次交付。'],points:[['定位准确','保留元素选择器和所在区域，降低猜测成本。'],['要求就地写','直接给当前元素记录修改要求。'],['交付清楚','一次复制包含必要信息，减少来回询问。']],visual:'elementcopy',status:'稳定版本'},
      {slug:'gestureflow',name:'鼠标手势',en:'GestureFlow',type:'效率工具 · Chrome 扩展',year:'2026',number:'07',desc:'用最自然的拖动完成后退、前进、关闭标签和超级拖拽。',lead:'一款让浏览器操作更快的鼠标手势扩展。用方向手势完成后退、前进、关闭标签，也能拖动链接、图片或文字执行对应操作。',story:['日常浏览中，一次返回、关闭标签、打开链接可能发生几百次。每次都去找小按钮，动作会变得割裂。','GestureFlow 用方向明确的鼠标手势完成高频动作，链接、图片与文字还可以通过超级拖拽快速打开或搜索。重点不是手势花样多，而是可靠、轻盈、不打断。'],points:[['高频动作','后退、前进、关闭标签的方向清楚。'],['超级拖拽','链接、图片和文字在一个自然动作里完成处理。'],['稳定优先','减少意外弹出菜单与拖拽失败。']],visual:'gestureflow',status:'稳定版本'}
    ];
    const entries = [
      {slug:'less',date:'2026 / 10 / 17',title:'少一点，才有可能看见真正重要的东西',desc:'一次关于界面、留白与不断删减的思考。',paragraphs:[
        '我曾经很容易被一种看上去“完成度很高”的界面吸引。它有丰富的卡片、漂亮的阴影、精巧的图标，几乎每个角落都像认真设计过。但当我真的开始使用它，反而很难记住任何一个细节。',
        '后来我慢慢发现：设计不是把所有可用的空间填满。真正的秩序，有时候来自决定什么不出现。',
        '一段说明可以删掉，前提是动作本身足够清楚；一组按钮可以合并，前提是用户不必猜测；一个动画可以不存在，前提是内容已经值得被看见。',
        '留白从来不是为了显得高冷。它是一种尊重：让使用者有时间辨认、理解和决定。',
        '我希望自己做的数字产品，拥有这种安静的力量。'
      ]},
      {slug:'quiet',date:'2026 / 10 / 15',title:'一个好工具，为什么应该尽量安静',desc:'从翻译、截图到浏览器，谈谈不打扰的价值。',paragraphs:[
        '效率工具很容易不断成长。发现一个问题，就多加一个按钮；看见一个场景，就多做一套菜单。短期内它似乎变得更强大，长期看却可能越来越难用。',
        '我做页截的时候，最在意的不是多一个工具，而是整个画布能不能始终稳定。做译见的时候，我更在意翻译能否恰好在需要的时刻出现，而不是抢先覆盖原文。',
        '这种判断看似和功能数量没有关系，却直接决定了一件工具能不能被长期信任。',
        '最好的交互并不是“看，我做到了什么”，而是让人轻轻松松地完成自己想做的事。'
      ]},
      {slug:'make',date:'2026 / 10 / 09',title:'当一个想法终于变得可以触碰',desc:'关于 AI Coding、创造和那一刻的满足感。',paragraphs:[
        '过去，有很多想法会停留在一句“如果能够这样就好了”。即使能把需求讲清楚，把产品画出来，距离真正使用仍然还有很长的距离。',
        'AI Coding 改变了我的创造方式。我不再只把自己看作提出需求的人，也能参与实现、验证和打磨。',
        '当然，能写出代码并不等于能做出好作品。真正花时间的部分，仍然是判断什么值得做，以及体验不对的时候，有没有耐心继续改。',
        '我喜欢那种时刻：一个最初只存在于脑海里的小东西，终于能够被点击、被观察，甚至被别人使用。',
        '这就是我为什么会一直做下去。'
      ]}
    ];
    const navItems=[['作品','works'],['实验室','lab'],['手记','journal'],['关于','about']];
    const link=(page)=>`#/${page}`;

    let ps33Stop=()=>{};
    function bindPageShotVideo(){
      ps33Stop();ps33Stop=()=>{};
      const video=document.querySelector('[data-ps33-video]');if(!video)return;
      const replay=document.querySelector('[data-ps33-replay]');
      const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let watched=false;let ended=false;
      video.muted=true;video.playsInline=true;video.src=PS33_CLIP;video.load();
      const observer=('IntersectionObserver' in window)?new IntersectionObserver(entries=>{
        const visible=entries[0].intersectionRatio>=0.35;
        if(visible&&!ended&&!watched&&!reduced){watched=true;video.play().catch(()=>{});}
        else if(!visible&&!video.paused){video.pause();watched=false;}
      },{threshold:[0,.35,.75]}):null;
      if(observer)observer.observe(video);else if(!reduced)video.play().catch(()=>{});
      video.addEventListener('ended',()=>{ended=true;});
      replay?.addEventListener('click',()=>{ended=false;watched=true;video.currentTime=0;video.play().catch(()=>{});});
      ps33Stop=()=>observer?.disconnect();
    }
    function showcase(p){
      if(p.slug==='pageshot'){
        return `<section class="case-showcase wrap" aria-label="页截真实操作录屏">
          <div class="ps33-shell"><video class="ps33-video" data-ps33-video muted playsinline preload="metadata" controls poster="assets/projects/pageshot.webp"  aria-label="页截 PageShot 真实操作：截图标注、箭头、文字、高亮及保存"></video></div>
          <div class="ps33-bottom"><button type="button" class="ps33-replay" data-ps33-replay>重播 ↻</button></div>
          <div class="film-link-row"><a class="film-github" href="https://github.com/Qqiang2738/PageShot" target="_blank" rel="noopener noreferrer">GitHub 源码 <span aria-hidden="true">↗</span></a></div>
        </section>`;
      }
      return originalShowcase(p);
    }
    const filmClosers=[];
    function bindFilms(){
      filmClosers.splice(0).forEach(fn=>fn());
      const shell=document.querySelector('[data-film]');if(!shell)return;
      const slug=shell.dataset.film,reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const cursor=shell.querySelector('.film-cursor');const progress=shell.querySelector('[data-film-progress]');
      const toggle=shell.querySelector('[data-film-toggle]');const stage=shell.querySelector('.film-stage');
      const duration=slug==='filedesk'?21800:(['yebo','pageshot'].includes(slug)?18000:filmLength);
       const count=slug==='filedesk'?7:6;
       const cues=slug==='filedesk'?[0,2700,5900,8200,11600,15100,17900,21800]:slug==='yebo'?[0,2800,5700,8600,11500,14800,18000]:slug==='pageshot'?[0,2300,5000,8100,11000,14800,18000]:null;
       let ms=reduced?duration:0, phase=-1, playing=!reduced, visible=true, last=null, raf=0;
      function draw(){
        const p=cues?Math.min(count-1,cues.findIndex((n,i)=>i<count&&ms>=n&&ms<cues[i+1])<0?count-1:cues.findIndex((n,i)=>i<count&&ms>=n&&ms<cues[i+1])):Math.min(count-1,Math.floor(ms/duration*count));
        if(p!==phase){
          phase=p;shell.dataset.phase=String(phase);
          if(slug==='filedesk'){
            const point=['drop','drop','word','word','generate','download','preview'][phase];
            const target=shell.querySelector(`[data-fd31-point="${point}"]`);
            if(target){const a=target.getBoundingClientRect(),b=stage.getBoundingClientRect();let x=a.left-b.left+a.width*.55,y=a.top-b.top+a.height*.53;
              if(phase===1){x=a.left-b.left+a.width*.45;y=a.top-b.top+a.height*.55}
              cursor.style.left=Math.min(b.width-26,Math.max(8,x))+'px';cursor.style.top=Math.min(b.height-35,Math.max(8,y))+'px';shell.style.setProperty('--click-x',Math.min(b.width-26,Math.max(8,x))+'px');shell.style.setProperty('--click-y',Math.min(b.height-35,Math.max(8,y))+'px');
            }
          }else if(slug==='yebo'||slug==='pageshot'){
            const point=(slug==='yebo'?['flower','flower','menu','menu','later','later']:['circle','circle','number','arrow','save','save'])[phase];
            const small=window.matchMedia('(max-width:750px)').matches;
            const target=shell.querySelector(`[data-v32-${small?'mobile':'desktop'}="${point}"]`);
            if(target){const a=target.getBoundingClientRect(),b=stage.getBoundingClientRect();const x=Math.max(8,Math.min(b.width-24,a.left-b.left+a.width/2));const y=Math.max(8,Math.min(b.height-30,a.top-b.top+a.height/2));cursor.style.left=x+'px';cursor.style.top=y+'px';shell.style.setProperty('--click-x',x+'px');shell.style.setProperty('--click-y',y+'px')}
          }else{
            const coords=filmPositions[slug][phase];cursor.style.left=coords[0]+'%';cursor.style.top=coords[1]+'%';
          }
          const pulse=shell.querySelector('.film-click');pulse?.classList.remove('pulse');
          // Click only when a decision or action is visibly taken; no pulsating "tutorial" hotspots.
          if((slug==='filedesk'&&[3,4,5,6].includes(phase))||(slug==='yebo'&&[2,3].includes(phase))||(slug==='pageshot'&&[1,3,5].includes(phase))||(!['filedesk','yebo','pageshot'].includes(slug)))requestAnimationFrame(()=>pulse?.classList.add('pulse'));
        }
        progress.style.width=Math.min(100,(ms/duration)*100)+'%';
        if(ms>=duration){playing=false;toggle.textContent=reduced?'查看开始':'重播';toggle.setAttribute('aria-label',reduced?'查看演示开头':'重新播放演示')}
        else{toggle.textContent=reduced?'查看结果':(playing?'暂停':'继续');toggle.setAttribute('aria-label',reduced?'查看演示结果':(playing?'暂停演示':'继续播放演示'))}
      }
      function tick(t){if(last!==null&&playing&&visible)ms=Math.min(duration,ms+Math.min(80,t-last));last=t;draw();raf=requestAnimationFrame(tick)}
      toggle.addEventListener('click',()=>{if(reduced){ms=ms>=duration?0:duration;playing=false}else{if(ms>=duration)ms=0;playing=!playing}last=null;draw()});
      const observer=('IntersectionObserver' in window)?new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;last=null},{threshold:.13}):null;
      observer?.observe(shell);
      // User controls animations. No automatic files are downloaded by the film.
      draw();raf=requestAnimationFrame(tick);
      filmClosers.push(()=>{cancelAnimationFrame(raf);observer?.disconnect()});
    }

    function article(e){return `<main class="page wrap"><article class="article-wrap"><a href="#/journal" class="case-back">← 返回手记</a><div class="article-head"><div class="article-date">${e.date.replaceAll(' / ','.')}</div><h1>${e.title.replace('，','，<br class="article-title-break">')}</h1></div><div class="article-body">${e.paragraphs.map(p=>`<p>${p}</p>`).join('')}<div style="padding-top:40px"><a class="text-link" href="#/journal">查看全部手记 <span aria-hidden="true">↗</span></a></div></div></article></main>`}
    function lab(){return `<main class="page">${innerIntro('02','EXPERIMENTAL LAB','实验室','')}<section class="lab-list wrap"><article class="lab-item"><div class="lab-art"><svg viewBox="0 0 200 160" width="185" aria-label="细线绘制的水纹实验"><g fill="none" stroke="#8aa28b" stroke-width="1"><ellipse cx="100" cy="80" rx="23" ry="15"/><ellipse cx="100" cy="80" rx="45" ry="29"/><ellipse cx="100" cy="80" rx="70" ry="45"/><ellipse cx="100" cy="80" rx="90" ry="62"/></g><circle cx="100" cy="80" r="2" fill="#69856f"/></svg></div><div><h2 class="lab-name">一圈涟漪</h2><p class="lab-desc">探索轻微的反馈，怎样让屏幕上的动作拥有触感。</p></div></article><article class="lab-item"><div class="lab-art"><svg viewBox="0 0 200 160" width="185" aria-label="几何秩序实验"><g fill="none" stroke="#a4a093" stroke-width="1.5"><rect x="31" y="25" width="65" height="48"/><rect x="103" y="25" width="65" height="48"/><rect x="31" y="80" width="137" height="57"/></g><path d="M45 48h33M117 48h33M48 105h104M48 119h62" stroke="#a4a093"/></svg></div><div><h2 class="lab-name">另一种秩序</h2><p class="lab-desc">让整理与发现，不必像在管理文件。</p></div></article><article class="lab-item"><div class="lab-art"><svg viewBox="0 0 200 160" width="185" aria-label="小型数字生命实验"><g fill="none" stroke="#9baba5" stroke-width="1"><circle cx="100" cy="80" r="58"/><ellipse cx="100" cy="80" rx="19" ry="58"/><path d="M42 80h116M58 42Q100 90 142 42M58 118Q100 70 142 118"/></g></svg></div><div><h2 class="lab-name">数字小生命</h2><p class="lab-desc">关于陪伴、玩耍，以及无需任务目标的互动。</p></div></article></section></main>`}
    function about(){return `<main class="page">${innerIntro('04','ABOUT','关于','')}<div class="wrap"><section class="about-block"><h2 class="about-big">让想法，<br>真正发生。</h2><div class="about-body"><p>我是一名独立创造者，正在使用 AI Coding，把脑海里的想法变成能运行、能使用的数字作品。</p><p>过去，我更多地在观察问题、描述需求、设计产品。现在，我也参与实现和打磨，直到一个想法真正被做出来。</p><p>我做浏览器工具，也做安静的桌面体验。它们类型不同，但都应该清楚、好用，保留一点人的温度。</p><div style="margin-top:45px"><a class="text-link" href="#/works">看看我的作品 <span aria-hidden="true">↗</span></a></div></div></section></div></main>`}
    const routes=()=>{const bits=(location.hash||'#/').slice(2).split('/').filter(Boolean);const root=bits[0]||'';if(root==='works')return {active:'works',html:works()};if(root==='work'){const p=projects.find(x=>x.slug===bits[1])||projects[0];return {active:'works',html:casePage(p)}}if(root==='journal'&&bits[1]){const e=entries.find(x=>x.slug===bits[1])||entries[0];return {active:'journal',html:article(e)}}if(root==='journal')return {active:'journal',html:journal()};if(root==='lab')return {active:'lab',html:lab()};if(root==='about')return {active:'about',html:about()};return {active:'',html:home()}};
    function bind(){bindFilms();bindPageShotVideo();
      const gallery=document.querySelector('[data-gallery]');
      if(gallery){
        const pictures=workGalleries[gallery.dataset.gallery]||[];
        const current=gallery.querySelector('[data-gallery-image]');
        let at=0;
        const show=(index)=>{if(!pictures.length)return;at=(index+pictures.length)%pictures.length;current.src=pictures[at].src;current.alt=pictures[at].alt;};
        gallery.querySelector('[data-gallery-prev]')?.addEventListener('click',()=>show(at-1));
        gallery.querySelector('[data-gallery-next]')?.addEventListener('click',()=>show(at+1));
        gallery.tabIndex=0;
        gallery.addEventListener('keydown',(e)=>{if(e.key==='ArrowLeft'){e.preventDefault();show(at-1)}if(e.key==='ArrowRight'){e.preventDefault();show(at+1)}});
      }
      const switchers=[...document.querySelectorAll('[data-showcase]')];
      if(switchers.length){switchers.forEach(button=>button.addEventListener('click',()=>{
        const selected=button.dataset.showcase;
        switchers.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
        document.querySelectorAll('[data-showcase-pane]').forEach(pane=>pane.hidden=pane.dataset.showcasePane!==selected);
      }));}
document.querySelector('[data-to-top]')?.addEventListener('click',()=>{window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
      document.querySelector('[data-scroll-works]')?.addEventListener('click',(e)=>{const target=document.getElementById('selected-work');if(target){e.preventDefault();target.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}});const menu=document.getElementById('menu-toggle');menu?.addEventListener('click',()=>{const existing=document.getElementById('mobile-nav');if(existing){existing.remove();menu.setAttribute('aria-expanded','false');menu.innerHTML='菜单 <span aria-hidden="true">☰</span>';return}const pane=document.createElement('nav');pane.id='mobile-nav';pane.className='mobile-nav';pane.setAttribute('aria-label','移动端导航');pane.innerHTML=navItems.map(([cn,key])=>`<a href="${link(key)}">${cn}</a>`).join('');document.querySelector('.site-head').appendChild(pane);menu.setAttribute('aria-expanded','true');menu.innerHTML='关闭 <span aria-hidden="true">×</span>'});
      document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});document.getElementById('works-list').innerHTML=workRows(b.dataset.filter)}));
      const reveals=document.querySelectorAll('.fade-in');if('IntersectionObserver' in window&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const io=new IntersectionObserver((entries)=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.10,rootMargin:'0px 0px -30px 0px'});reveals.forEach(el=>io.observe(el))}else{reveals.forEach(el=>el.classList.add('visible'))}}
    function render(){const route=routes();document.getElementById('app').innerHTML=header(route.active)+route.html+footer();document.title=(route.active?({works:'作品',lab:'实验室',journal:'创作手记',about:'关于'}[route.active]+' · '):'')+'光头Qqiang · qqiang.com';bind();window.scrollTo({top:0,behavior:'instant'})}
    window.addEventListener('hashchange',render);render();
  })();
  
  </script>
</body>
</html>
