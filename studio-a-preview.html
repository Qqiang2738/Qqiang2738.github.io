/* V3.5 — curatorial layout, one true-use video per work; all sizes from design tokens */

</head>
<body>
  <div id="app"></div>
  <script>

  (()=>{

    // Project-sourced visuals. Keep verified provenance in README, not repeated visitor labels.
    const projectImages = {
      yijian: {src:'assets/projects/yijian-selection.webp', alt:'译见 V1.4.1 划词翻译实际开发预览'},
      yebo: {src:'assets/projects/yebo.webp', alt:'页泊花园模式界面预览'},
      pageshot: {src:'assets/projects/pageshot.webp', alt:'页截 V2.2.1 编辑器界面'},
      filedesk: {src:'assets/projects/filedesk-work.webp', alt:'文序 V1.0 文件处理工作台'},
      elementcopy: {src:'assets/projects/elementcopy.webp', alt:'ElementCopy Lite V1.5.1 的实际界面预览'},
      gestureflow: {src:'assets/projects/gestureflow.webp', alt:'GestureFlow V2.3 的实际界面预览'}
    };
    const workGalleries = {
      pageshot: [
        {src:'assets/projects/pageshot.webp',alt:'页截 V2.2.1 的右侧浮动属性面板'},
        {src:'assets/projects/pageshot-workspace.webp',alt:'页截 V2.2.0 的编辑器布局'}
      ],
      yijian: [
        {src:'assets/projects/yijian-selection.webp',alt:'译见 V1.4.1 划词翻译界面'},
        {src:'assets/projects/yijian-popup.webp',alt:'译见 V1.4.1 浏览器扩展面板'},
        {src:'assets/projects/yijian-glossary.webp',alt:'译见 V1.4.1 术语管理界面'}
      ],
      elementcopy: [{src:'assets/projects/elementcopy.webp',alt:'ElementCopy Lite 实际界面预览'}],
      gestureflow: [{src:'assets/projects/gestureflow.webp',alt:'GestureFlow 实际界面预览'}],
      filedesk: [
        {src:'assets/projects/filedesk-work.webp',alt:'文序 V1.0 文件处理工作台'},
        {src:'assets/projects/filedesk-start.webp',alt:'文序 V1.0 文件投放入口'},
        {src:'assets/projects/filedesk-preview.webp',alt:'文序 V1.0 PDF 合并预览'},
        {src:'assets/projects/filedesk-result.webp',alt:'文序 V1.0 文件处理完成'}
      ]
    };
    const projects = [
      {slug:'pageshot',name:'页截',en:'PageShot',type:'工具 · Chrome 扩展',year:'2026',number:'03',desc:'完整截取网页，直接在稳定的画布上标注、裁切，再一键复制或保存。',lead:'页截是一款 Chrome 长截图与标注工具。从截取整页、圈出重点，到添加箭头、文字、马赛克和裁切，整个过程都在同一张稳定的画布里完成，最后可以直接复制或保存图片。',story:['截图只是开始。真正影响体验的，是后面的一系列微小动作：裁切、圈出重点、写一句话、调整位置、把内容送到另一个地方。','我希望这些动作自然地发生在同一个空间，不因为选中了某个工具就让画布忽然变宽或变窄，也不为了简单的文字操作增加一次模式切换。'],quote:'工具越被频繁使用，越应该学会退后一步。',points:[['稳定的画布','属性面板以轻量浮层出现，不挤压正在编辑的内容。'],['就地完成','文字输入、拖动与编辑都发生在同一个工具里。'],['快速离开','完成标注后，可以直接复制或保存，无须走多余流程。']],visual:'pageshot',status:'稳定版本 V2.2.1'},
      {slug:'yebo',name:'页泊',en:'YEBO',type:'浏览器 · Chrome 扩展',year:'2026',number:'02',desc:'把打开的标签、常用书签和稍后阅读整理在一个新标签页里。',lead:'页泊是一款 Chrome 新标签页扩展。它把高频书签、正在打开的标签和稍后阅读放在同一个工作台，帮助你快速整理浏览中的杂乱；也可以切换到花园模式，用更轻松的方式管理页面。',story:['打开一个网页很容易，但放下它并不容易。标签越积越多，稍后阅读越来越长，有价值的内容被杂乱的窗口淹没。','页泊尝试让这些内容重新拥有秩序：经常用到的内容容易到达，正在进行的任务可以归在一起，暂时无法处理的页面也有合适的停靠位置。'],quote:'好的秩序感，不应该让人感觉自己正在整理。',points:[['低负担入口','新标签页不应该像一个复杂的仪表盘，而应该让下一步清晰可见。'],['自然地归类','把打开的页面、书签与稍后阅读当成同一段浏览体验的不同状态。'],['花园里的想象力','在另一种视图中，用花与花盆重新理解标签页，但不改变功能本身的可靠性。']],visual:'yebo',status:'已发布稳定基线'},
      {slug:'yijian',name:'译见',en:'YiJian',type:'语言工具 · Chrome 扩展',year:'2026',number:'04',desc:'阅读时保持原文，需要的时候再划词、翻译段落或整页。',lead:'译见是一款按需翻译的 Chrome 扩展。网页和邮件打开时默认保持原文；需要理解时，再主动触发划词、段落或整页翻译，还可以辅助处理邮件回复，不打断原本的阅读。',story:['阅读外文网页或邮件时，翻译很有帮助。但当它自动覆盖原文、改变排版、抢在读者前面做决定时，帮助就会变成打扰。','译见采用了一个简单而坚定的原则：自动就绪，不自动翻译。划词、段落和整页翻译，都由读者主动触发。'],quote:'好的辅助，是在需要时出现，在不需要时安静。',points:[['保留原文','新网页与新邮件始终先呈现自己的原始内容。'],['主动触发','用户决定翻译的范围和时间，扩展只在旁边准备好。'],['体验一致','网页阅读与邮件回复共享同一套克制、可靠的交互原则。']],visual:'yijian',status:'稳定版本 V1.4.1'},
      {slug:'elementcopy',name:'元素复制',en:'ElementCopy Lite',type:'开发辅助 · Chrome 扩展',year:'2026',number:'06',desc:'在网页上点选元素、写下修改要求，一次复制可交给 AI 的任务。',lead:'ElementCopy Lite 是一个网页修改沟通工具。用鼠标选中想调整的元素，直接写下要求，扩展就会整理选择器、所在区域和相关上下文，生成可以复制给 AI 的结构化修改任务。',story:['和 AI 一起改页面时，沟通中最费力的经常不是修改本身，而是如何准确指出要修改哪个元素。','ElementCopy Lite 将目标元素的定位、上下文和修改要求组合为一条结构化任务。选择器优先可靠，文本和截图保持对应，把反复沟通变成一次交付。'],points:[['定位准确','保留元素选择器和所在区域，降低猜测成本。'],['要求就地写','直接给当前元素记录修改要求。'],['交付清楚','一次复制包含必要信息，减少来回询问。']],visual:'elementcopy',status:'稳定版本'},
      {slug:'gestureflow',name:'鼠标手势',en:'GestureFlow',type:'效率工具 · Chrome 扩展',year:'2026',number:'07',desc:'用鼠标手势完成浏览器操作，让高频动作更顺手。',lead:'GestureFlow 是一款 Chrome 鼠标手势扩展。用自然的方向手势完成返回、前进、关闭标签；拖动链接、图片或文字，也可以快速打开或搜索，减少反复寻找浏览器按钮的时间。',story:['日常浏览中，一次返回、关闭标签、打开链接可能发生几百次。每次都去找小按钮，动作会变得割裂。','GestureFlow 用方向明确的鼠标手势完成高频动作，链接、图片与文字还可以通过超级拖拽快速打开或搜索。重点不是手势花样多，而是可靠、轻盈、不打断。'],points:[['高频动作','后退、前进、关闭标签的方向清楚。'],['超级拖拽','链接、图片和文字在一个自然动作里完成处理。'],['稳定优先','减少意外弹出菜单与拖拽失败。']],visual:'gestureflow',status:'稳定版本'}
    ];
    const entries = [
      {slug:'less',date:'2026 / 10 / 17',title:'少一点，才有可能看见真正重要的东西',desc:'一次关于界面、留白与不断删减的思考。',paragraphs:[
        '我曾经很容易被一种看上去“完成度很高”的界面吸引。它有丰富的卡片、漂亮的阴影、精巧的图标，几乎每个角落都像认真设计过。但当我真的开始使用它，反而很难记住任何一个细节。',
        '后来我慢慢发现：设计不是把所有可用的空间填满。真正的秩序，有时候来自决定什么不出现。',
        '一段说明可以删掉，前提是动作本身足够清楚；一组按钮可以合并，前提是用户不必猜测；一个动画可以不存在，前提是内容已经值得被看见。',
        '留白从来不是为了显得高冷。它是一种尊重：让使用者有时间辨认、理解和决定。',
        '我希望自己做的数字产品，拥有这种安静的力量。'
      ]},
      {slug:'quiet',date:'2026 / 10 / 15',title:'一个好工具，为什么应该尽量安静',desc:'从翻译、截图到浏览器，谈谈不打扰的价值。',paragraphs:[
        '效率工具很容易不断成长。发现一个问题，就多加一个按钮；看见一个场景，就多做一套菜单。短期内它似乎变得更强大，长期看却可能越来越难用。',
        '我做页截的时候，最在意的不是多一个工具，而是整个画布能不能始终稳定。做译见的时候，我更在意翻译能否恰好在需要的时刻出现，而不是抢先覆盖原文。',
        '这种判断看似和功能数量没有关系，却直接决定了一件工具能不能被长期信任。',
        '最好的交互并不是“看，我做到了什么”，而是让人轻轻松松地完成自己想做的事。'
      ]},
      {slug:'make',date:'2026 / 10 / 09',title:'当一个想法终于变得可以触碰',desc:'关于 AI Coding、创造和那一刻的满足感。',paragraphs:[
        '过去，有很多想法会停留在一句“如果能够这样就好了”。即使能把需求讲清楚，把产品画出来，距离真正使用仍然还有很长的距离。',
        'AI Coding 改变了我的创造方式。我不再只把自己看作提出需求的人，也能参与实现、验证和打磨。',
        '当然，能写出代码并不等于能做出好作品。真正花时间的部分，仍然是判断什么值得做，以及体验不对的时候，有没有耐心继续改。',
        '我喜欢那种时刻：一个最初只存在于脑海里的小东西，终于能够被点击、被观察，甚至被别人使用。',
        '这就是我为什么会一直做下去。'
      ]}
    ];
    const navItems=[['作品','works'],['手记','journal'],['关于','about']];
    const link=(page)=>`#/${page}`;
    const plainSVG=(inner)=>`<svg viewBox="0 0 620 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="作品视觉插画">${inner}</svg>`;
    function visual(slug){
      if(slug==='pond')return `<div class="pond-scene"><div class="pond-disc"></div>${plainSVG(`<defs><g id="koi"><path d="M0-29C11-16 10 7 0 25C-10 7-11-16 0-29Z" fill="#f4efe3"/><path d="M0 18 Q-18 39 -11 46 L0 36 L11 46 Q18 39 0 18" fill="#eee6d5"/><path d="M-5-15L-13-6L-6-1M5-15L13-6L6-1" fill="#e6e5dc"/><circle cx="-4" cy="-20" r="1.15" fill="#555a54"/><circle cx="4" cy="-20" r="1.15" fill="#555a54"/></g><g id="redKoi"><use href="#koi"/><path d="M0-28 Q7-13 0-6 Q-7-13 0-28" fill="#b3755d"/><path d="M-4 6Q0 2 4 6L5 10Q0 15-5 10Z" fill="#b3755d"/></g></defs><g class="fish" transform="translate(240 169) rotate(30)"><use href="#redKoi" transform="scale(1.4)"/></g><g class="fish" transform="translate(349 228) rotate(223)"><use href="#koi" transform="scale(1.0)"/></g><g class="fish" transform="translate(280 313) rotate(125)"><use href="#redKoi" transform="scale(.9)"/></g><g class="fish" transform="translate(410 308) rotate(-36)"><use href="#koi" transform="scale(.54)"/></g><circle cx="355" cy="140" r="35" fill="none" stroke="#dae4da" stroke-width="1.2" opacity=".75"/><circle cx="355" cy="140" r="52" fill="none" stroke="#dae4da" stroke-width=".8" opacity=".54"/><circle cx="195" cy="298" r="30" fill="none" stroke="#dae4da" stroke-width=".8" opacity=".5"/>`)}</div>`;
      if(slug==='yebo')return `<div class="yebo-visual"><div class="browser-mock"><div class="browser-top"><i></i><i></i><i></i></div><div class="browser-content"><div class="browser-greeting">让每一个页面，都有归处。</div><div class="browser-search"><span>搜索，或开始新的探索</span><span>↗</span></div><div class="browser-icons"><span></span><span></span><span></span><span></span><span></span></div></div></div></div>`;
      if(slug==='pageshot')return `<div class="pageshot-visual"><div class="shot-paper"><div class="shot-title"></div><div class="shot-line"></div><div class="shot-line"></div><div class="shot-line"></div><div class="shot-photo"><div class="shot-select"></div></div></div></div>`;
      if(slug==='yijian')return `<div class="translate-visual"><div class="trans-col"><div class="trans-word trans-en">A quieter way<br>to <span class="trans-highlight">understand</span><br>the world.</div></div><div class="trans-col"><div class="trans-word">以更安静的方式，<br>理解世界。</div></div></div>`;
      return `<div class="file-visual"><div class="file-sheet back"></div><div class="file-sheet front"><h3 class="file-title">让文件，<br>有序发生。</h3><div class="file-rule"></div><div class="file-table">${Array.from({length:12},(_,i)=>`<span>${i<3?['编号','物料名称','数量'][i]:'—'}</span>`).join('')}</div></div></div>`;
    }
    const displayPosters = {
      pageshot:'assets/projects/pageshot-film-cover-v3.5.webp',
      yebo:'assets/projects/yebo-film-cover-v3.5.webp',
      yijian:'assets/projects/yijian-film-cover-v3.5.webp',
      elementcopy:'assets/projects/elementcopy-film-cover-v3.5.webp',
      gestureflow:'assets/projects/gestureflow-film-cover-v3.5.webp'
    };
    function stage(p,large=false){
      const mode=large?'case-stage':'feature-stage';
      const image=displayPosters[p.slug]?{src:displayPosters[p.slug],alt:p.name+' 真实操作视频画面'}:projectImages[p.slug];
      if(image)return `<div class="${mode} asset-stage asset-${p.slug}"><img src="${image.src}" alt="${image.alt}" loading="eager" decoding="sync"></div>`;
      return `<div class="${mode} ${p.visual}">${visual(p.visual)}</div>`;
    }
    function header(active){return `<header class="site-head"><a class="brand" href="#/" aria-label="回到首页">光头<span class="brand-qiang">Qqiang</span></a><nav class="nav" aria-label="主导航">${navItems.map(([cn,key])=>`<a href="${link(key)}" class="${key===active?'active':''}">${cn}</a>`).join('')}</nav><button id="menu-toggle" class="menu-btn" aria-expanded="false" aria-label="打开菜单">菜单 <span aria-hidden="true">☰</span></button></header>`}
    const footer=()=>`<footer class="site-footer wrap"><div><div class="name">光头Qqiang</div><div class="foot-domain">qqiang.com</div></div><div class="foot-right"><a href="#/works">作品</a><a href="#/journal">手记</a><a href="#/about">关于</a><button type="button" class="foot-top" data-to-top>回到顶部 ↑</button></div></footer>`;
    // V3.6: works are arranged like an editorial exhibition; real recording posters only.
    const featured=(p,idx)=>`<article class="curated-item ${idx%2===1?'is-flipped':''}">
      <div class="curated-copy"><h3>${p.name}</h3><div class="curated-en">${p.en}</div><p>${p.desc}</p><a class="curated-link" href="#/work/${p.slug}">查看作品 <span aria-hidden="true">↗</span></a></div>
      <a class="curated-image" href="#/work/${p.slug}" aria-label="观看${p.name}的真实操作"><img src="${displayPosters[p.slug]}" alt="${p.name}真实操作视频画面" loading="eager" decoding="async"></a>
    </article>`;
    const studioTile=(slug)=>{const p=projects.find(p=>p.slug===slug);return `<article class="studio-tile"><a class="studio-tile-image" href="#/work/${slug}" aria-label="查看${p.name}的真实使用演示"><img src="${displayPosters[slug]}" alt="${p.name}真实操作画面" loading="eager"></a><div class="studio-tile-under"><div><h3>${p.name}</h3><p>${p.desc}</p></div><a href="#/work/${slug}" aria-label="打开${p.name}详情">↗</a></div></article>`};
    function home(){const p=projects.find(p=>p.slug==='pageshot');return `<main class="page studio-home"><section class="studio-intro wrap"><div><div class="studio-eyebrow">光头Qqiang · 独立创造者</div><h1>想到了，<br>就把它做出来。</h1></div><div class="studio-hello"><p><strong>我是光头Qqiang。</strong><br>借助 AI Coding，创作好用、好玩，也有一点温度的数字产品。</p><a class="studio-link" href="#/about">认识我 <span aria-hidden="true">↗</span></a></div></section><section class="studio-feature wrap"><div class="studio-section-head"><h2>最近的作品</h2><span class="quiet">从真实操作，认识一个产品。</span></div><a class="studio-main-image" href="#/work/pageshot" aria-label="观看页截操作演示"><img src="${displayPosters.pageshot}" alt="页截真实操作：网页截图与标注" loading="eager"></a><div class="studio-feature-meta"><div><h3>页截 <span class="curated-en">PageShot</span></h3><p>截取整张网页，在稳定的画布上完成标注、裁切，然后直接复制或保存。</p></div><a class="studio-link" href="#/work/pageshot">观看使用演示 <span aria-hidden="true">↗</span></a></div></section><section class="studio-more wrap"><div class="studio-section-head"><h2>还做了这些</h2></div><div class="studio-more-grid">${['yebo','yijian'].map(studioTile).join('')}</div><div class="studio-all"><a href="#/works" class="studio-link">查看所有作品 <span aria-hidden="true">↗</span></a></div></section><section class="studio-note wrap"><h2>做一点有用的，<br>也做一点有趣的。</h2><a href="#/journal" class="studio-link">读读创作手记 <span aria-hidden="true">↗</span></a></section></main>`}

    function innerIntro(n,label,title,desc){return `<section class="inner-intro wrap"><h1>${title}</h1>${desc?`<p class="subline">${desc}</p>`:``}</section>`}
    function works(){return `<main class="page">${innerIntro('','','作品','')}<section class="wrap"><p class="works-intro">这些工具来自日常使用中遇到的小问题。点开一件作品，就能看见它真正的操作过程。</p><div class="works-list works-film-list">${workRows()}</div></section></main>`}
    function workRows(){return projects.map(p=>`<a class="works-row works-film-row" href="#/work/${p.slug}" aria-label="观看${p.name}真实操作视频"><span class="works-preview"><img src="${displayPosters[p.slug]}" alt="${p.name}真实操作录像画面" loading="lazy"></span><span class="works-description"><span class="wcn">${p.name} <span class="work-en-inline">${p.en}</span></span><span class="wcopy">${p.desc}</span><span class="wcategory">${p.type}</span></span><span class="wgo" aria-hidden="true">↗</span></a>`).join('')}
    const editorial={
      pond:{why:'给忙碌的屏幕，留一片安静。',details:'不是每一次互动，都需要一个任务。'},

              cursor.style.left=Math.min(b.width-26,Math.max(8,x))+'px';cursor.style.top=Math.min(b.height-35,Math.max(8,y))+'px';shell.style.setProperty('--click-x',Math.min(b.width-26,Math.max(8,x))+'px');shell.style.setProperty('--click-y',Math.min(b.height-35,Math.max(8,y))+'px');
            }
          }else if(slug==='yebo'||slug==='pageshot'){
            const point=(slug==='yebo'?['flower','flower','menu','menu','later','later']:['circle','circle','number','arrow','save','save'])[phase];
            const small=window.matchMedia('(max-width:750px)').matches;
            const target=shell.querySelector(`[data-v32-${small?'mobile':'desktop'}="${point}"]`);
            if(target){const a=target.getBoundingClientRect(),b=stage.getBoundingClientRect();const x=Math.max(8,Math.min(b.width-24,a.left-b.left+a.width/2));const y=Math.max(8,Math.min(b.height-30,a.top-b.top+a.height/2));cursor.style.left=x+'px';cursor.style.top=y+'px';shell.style.setProperty('--click-x',x+'px');shell.style.setProperty('--click-y',y+'px')}
          }else{
            const coords=filmPositions[slug][phase];cursor.style.left=coords[0]+'%';cursor.style.top=coords[1]+'%';
          }
          const pulse=shell.querySelector('.film-click');pulse?.classList.remove('pulse');
          // Click only when a decision or action is visibly taken; no pulsating "tutorial" hotspots.
          if((slug==='filedesk'&&[3,4,5,6].includes(phase))||(slug==='yebo'&&[2,3].includes(phase))||(slug==='pageshot'&&[1,3,5].includes(phase))||(!['filedesk','yebo','pageshot'].includes(slug)))requestAnimationFrame(()=>pulse?.classList.add('pulse'));
        }
        progress.style.width=Math.min(100,(ms/duration)*100)+'%';
        if(ms>=duration){playing=false;toggle.textContent=reduced?'查看开始':'重播';toggle.setAttribute('aria-label',reduced?'查看演示开头':'重新播放演示')}
        else{toggle.textContent=reduced?'查看结果':(playing?'暂停':'继续');toggle.setAttribute('aria-label',reduced?'查看演示结果':(playing?'暂停演示':'继续播放演示'))}
      }
      function tick(t){if(last!==null&&playing&&visible)ms=Math.min(duration,ms+Math.min(80,t-last));last=t;draw();raf=requestAnimationFrame(tick)}
      toggle.addEventListener('click',()=>{if(reduced){ms=ms>=duration?0:duration;playing=false}else{if(ms>=duration)ms=0;playing=!playing}last=null;draw()});
      const observer=('IntersectionObserver' in window)?new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;last=null},{threshold:.13}):null;
      observer?.observe(shell);
      // User controls animations. No automatic files are downloaded by the film.
      draw();raf=requestAnimationFrame(tick);
      filmClosers.push(()=>{cancelAnimationFrame(raf);observer?.disconnect()});
    }
    const workNotes = {
      pond:['它的目标不是把桌面变成一个需要照看的游戏，而是提供低打扰的陪伴。鱼的大小、游动关系和雨滴反馈，是这件作品花时间打磨的地方。'],
      yebo:['页泊同时面对两种情况：有人需要快速打开高频网站，有人需要把暂时放下的标签收起来。标准模式先处理秩序，花园模式再增加一点玩耍感，功能应该保持一致。'],
      filedesk:['许多采购与设备系统仍会导出旧版 .xls 物料清单。分享文件时，接收者可能需要的是一份可以交付、可以编辑的 Word 表格，而不只是一个截图。', '演示展现 Excel 物料清单成为可编辑 Word 的完整流程，并提供由文序转换引擎实际生成的示例文档。需要处理自己的文件，可以从 GitHub 获取文序并运行完整应用。'],
      pageshot:['截图之后的标注，往往比截图本身更耗时间。这里关注的是工具切换时画布保持不动，用户可以在同一个空间里完成文字、箭头、裁切和保存。'],
      yijian:['网页打开后默认保留原文，翻译由人主动触发。这避免了自动翻译覆盖阅读内容，也让外文网页和邮件回复的操作保持一致。'],
      elementcopy:['修改网页时，说清楚“改哪里”通常比说清楚“改什么”更费力。元素复制把页面位置、选择器、周边上下文和修改要求放在同一条可复制的任务里。'],
      gestureflow:['返回上一页、关闭标签和拖拽内容都是高频动作。这件作品追求的不是手势数量，而是让动作稳定识别，同时避免右键菜单和拖拽行为互相干扰。']
    };
    function casePage(p){
      const next=projects[(projects.indexOf(p)+1)%projects.length];
      return `<main class="page">
        <section class="case-top wrap">
          <a href="#/works" class="case-back"><span aria-hidden="true">←</span> 返回作品</a>
          <div class="case-head"><div><h1>${p.name}</h1><div class="en-name">${p.en}</div></div><p class="case-lead">${p.lead}</p></div>
        </section>
        ${showcase(p)}
        <section class="case-next wrap"><a href="#/work/${next.slug}" class="next-name">下一件作品：${next.name} <span class="next-arrow" aria-hidden="true">↗</span></a><a href="#/works" class="back-all">返回作品 ↗</a></section>
      </main>`;
    }
    function journal(){return `<main class="page">${innerIntro('03','JOURNAL','手记','')}<section class="wrap"><div class="notes-list">${entries.map(e=>`<a class="notes-row" href="#/journal/${e.slug}"><div class="date">${e.date.replaceAll(' / ','.')}</div><div><h2>${e.title}</h2><div class="note-desc">${e.desc}</div></div><div class="narrow" aria-hidden="true">↗</div></a>`).join('')}</div></section></main>`}
    function article(e){return `<main class="page wrap"><article class="article-wrap"><a href="#/journal" class="case-back">← 返回手记</a><div class="article-head"><div class="article-date">${e.date.replaceAll(' / ','.')}</div><h1>${e.title.replace('，','，<br class="article-title-break">')}</h1></div><div class="article-body">${e.paragraphs.map(p=>`<p>${p}</p>`).join('')}<div style="padding-top:40px"><a class="text-link" href="#/journal">查看全部手记 <span aria-hidden="true">↗</span></a></div></div></article></main>`}
    function about(){return `<main class="page about-page"><div class="wrap"><section class="about-block about-refined"><div class="about-side"><div class="about-avatar-frame"><svg class="about-avatar-illustration" viewBox="0 0 500 500" role="img" aria-label="光头Qqiang 极简手绘头像，两颗黑色圆点眼睛和米白色椭圆脸庞">
    <path d="M251 69 C346 69 403 147 401 234 C401 328 347 431 248 431 C140 431 101 350 101 265 C99 155 147 69 251 69 Z" fill="#fffcf2" stroke="#142a3a" stroke-width="18" stroke-linejoin="round"/>
    <circle cx="195" cy="218" r="13" fill="#142a3a"/><circle cx="310" cy="234" r="13" fill="#142a3a"/>
  </svg></div><h2 class="about-big">让想法，<br>真正发生。</h2></div><div class="about-body"><p>我是光头Qqiang，一名独立创造者。过去，我习惯从产品的角度观察问题、整理需求和设计体验；现在借助 AI Coding，我也能把脑海里的想法一步步做成真正可以运行、可以使用的软件。</p><p>我喜欢做小而有用的工具，也喜欢那些让数字生活变得轻松一点的体验。做页截，是想让截图和标注更顺手；做译见，是希望翻译只在需要时出现；做页泊，则是想让越来越多的浏览器标签重新变得有序。</p><p>对我来说，完成一个功能不是终点。我更在意它有没有解决真实的问题、第一次使用是否清楚、一次操作是否足够自然。我会不断试用、修改和删减，直到这些细节能够彼此协调。</p><p>这里存放我做出来的作品，也记录从想法到产品的过程。如果你也喜欢设计、创造，或只是想把一个点子变成现实，欢迎一起交流。</p><div class="about-links"><a class="text-link" href="#/works">看看作品 <span aria-hidden="true">↗</span></a><a class="text-link" href="https://github.com/Qqiang2738" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></div></div></section></div></main>`}
    const routes=()=>{const bits=(location.hash||'#/').slice(2).split('/').filter(Boolean);const root=bits[0]||'';if(root==='works')return {active:'works',html:works()};if(root==='work'){const p=projects.find(x=>x.slug===bits[1]);return {active:'works',html:p?casePage(p):works()}}if(root==='journal'&&bits[1]){const e=entries.find(x=>x.slug===bits[1])||entries[0];return {active:'journal',html:article(e)}}if(root==='journal')return {active:'journal',html:journal()};if(root==='about')return {active:'about',html:about()};return {active:'',html:home()}};
    function bind(){bindFilms();bindPageShotVideo();
      const gallery=document.querySelector('[data-gallery]');
      if(gallery){
        const pictures=workGalleries[gallery.dataset.gallery]||[];
        const current=gallery.querySelector('[data-gallery-image]');
        let at=0;
        const show=(index)=>{if(!pictures.length)return;at=(index+pictures.length)%pictures.length;current.src=pictures[at].src;current.alt=pictures[at].alt;};
        gallery.querySelector('[data-gallery-prev]')?.addEventListener('click',()=>show(at-1));
        gallery.querySelector('[data-gallery-next]')?.addEventListener('click',()=>show(at+1));
        gallery.tabIndex=0;
        gallery.addEventListener('keydown',(e)=>{if(e.key==='ArrowLeft'){e.preventDefault();show(at-1)}if(e.key==='ArrowRight'){e.preventDefault();show(at+1)}});
      }
      const switchers=[...document.querySelectorAll('[data-showcase]')];
      if(switchers.length){switchers.forEach(button=>button.addEventListener('click',()=>{
        const selected=button.dataset.showcase;
        switchers.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
        document.querySelectorAll('[data-showcase-pane]').forEach(pane=>pane.hidden=pane.dataset.showcasePane!==selected);
      }));}
document.querySelector('[data-to-top]')?.addEventListener('click',()=>{window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
      document.querySelector('[data-scroll-works]')?.addEventListener('click',(e)=>{const target=document.getElementById('selected-work');if(target){e.preventDefault();target.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}});const menu=document.getElementById('menu-toggle');menu?.addEventListener('click',()=>{const existing=document.getElementById('mobile-nav');if(existing){existing.remove();menu.setAttribute('aria-expanded','false');menu.innerHTML='菜单 <span aria-hidden="true">☰</span>';return}const pane=document.createElement('nav');pane.id='mobile-nav';pane.className='mobile-nav';pane.setAttribute('aria-label','移动端导航');pane.innerHTML=navItems.map(([cn,key])=>`<a href="${link(key)}">${cn}</a>`).join('');document.querySelector('.site-head').appendChild(pane);menu.setAttribute('aria-expanded','true');menu.innerHTML='关闭 <span aria-hidden="true">×</span>'});
      const reveals=document.querySelectorAll('.fade-in');if('IntersectionObserver' in window&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const io=new IntersectionObserver((entries)=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.10,rootMargin:'0px 0px -30px 0px'});reveals.forEach(el=>io.observe(el))}else{reveals.forEach(el=>el.classList.add('visible'))}}
    function render(){const route=routes();document.getElementById('app').innerHTML=header(route.active)+route.html+footer();document.title=(route.active?({works:'作品',journal:'创作手记',about:'关于'}[route.active]+' · '):'')+'光头Qqiang · qqiang.com';bind();window.scrollTo({top:0,behavior:'instant'})}
    window.addEventListener('hashchange',render);render();
  })();
  
  </script>
